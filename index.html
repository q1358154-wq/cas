<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    >
    <meta name="theme-color" content="#020617">
    <meta name="color-scheme" content="dark">
    <title>AI 智能控制台</title>
<script src="https://cdn.tailwindcss.com"></script>
<link
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    rel="stylesheet"
>
<style>
    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        scrollbar-width: none;
    }
    *::-webkit-scrollbar {
        width: 0;
        height: 0;
        display: none;
    }
    html,
    body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #020617;
    }
    body {
        min-height: 100vh;
        min-height: 100dvh;
        color: #f8fafc;
        font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            Roboto,
            Helvetica,
            Arial,
            "PingFang SC",
            "Hiragino Sans GB",
            "Microsoft YaHei",
            sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
    }
    :root {
        --viewport-height: 100dvh;
        --keyboard-height: 0px;
    }
    #app {
        width: 100%;
        height: var(--viewport-height);
        min-height: 100svh;
        overflow: hidden;
    }
    .safe-top {
        padding-top: env(safe-area-inset-top);
    }
    .safe-bottom {
        padding-bottom: env(safe-area-inset-bottom);
    }
    input,
    textarea,
    button {
        font-size: 16px;
    }
    input,
    textarea {
        -webkit-appearance: none;
        appearance: none;
    }
    button {
        -webkit-user-select: none;
        user-select: none;
    }
    button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
    }
    #user-input {
        outline: none;
    }
    #user-input:focus {
        outline: none;
    }
    .message-enter {
        animation: messageEnter 0.2s ease-out;
    }
    @keyframes messageEnter {
        from {
            opacity: 0;
            transform: translateY(8px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    .typing-dot {
        animation: typing 1.2s infinite ease-in-out;
    }
    .typing-dot:nth-child(2) {
        animation-delay: 0.15s;
    }
    .typing-dot:nth-child(3) {
        animation-delay: 0.3s;
    }
    @keyframes typing {
        0%,
        60%,
        100% {
            opacity: 0.25;
            transform: translateY(0);
        }
        30% {
            opacity: 1;
            transform: translateY(-2px);
        }
    }
    #history-drawer,
    #config-modal,
    #session-delete-modal {
        transition: opacity 0.2s ease;
    }
    #history-panel {
        transition:
            transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #history-drawer.hidden,
    #config-modal.hidden,
    #session-delete-modal.hidden {
        opacity: 0;
        pointer-events: none;
    }
    #history-drawer.hidden #history-panel {
        transform: translateX(-100%);
    }
    .modal-panel {
        transform: translateY(0) scale(1);
        transition:
            transform 0.2s ease,
            opacity 0.2s ease;
    }
    .modal-overlay.hidden .modal-panel {
        transform: translateY(8px) scale(0.98);
        opacity: 0;
    }
    .session-item {
        transition:
            background-color 0.15s ease,
            transform 0.15s ease;
    }
    .session-item:active {
        transform: scale(0.985);
    }
    .active-session {
        background: rgba(79, 70, 229, 0.16);
        border-color: rgba(99, 102, 241, 0.28);
    }
    .composer-shell {
        padding-bottom: max(12px, env(safe-area-inset-bottom));
    }
    .keyboard-active .composer-shell {
        padding-bottom: 8px;
    }
    .error-bubble {
        border-color: rgba(239, 68, 68, 0.28);
        background: rgba(127, 29, 29, 0.18);
    }
    .deployment-active {
        border-color: rgba(99, 102, 241, 0.45);
        background: rgba(79, 70, 229, 0.12);
    }
    .deployment-agent-active {
        border-color: rgba(16, 185, 129, 0.45);
        background: rgba(16, 185, 129, 0.08);
    }
    .line-clamp-1 {
        display: -webkit-box;
        -webkit-line-clamp: 1;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }
    .line-clamp-2 {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }
    @media (min-width: 640px) {
        #history-panel {
            width: 360px;
        }
    }
</style>
</head>
<body class="bg-slate-950 text-slate-100">
<div id="app" class="flex flex-col bg-slate-950">
<!-- ============================== -->
<!-- Header -->
<!-- ============================== -->
<header
    class="shrink-0 px-4 py-3 flex items-center justify-between border-b border-slate-800 bg-slate-900/90 backdrop-blur-md z-20 safe-top"
>
    <div class="flex items-center min-w-0 space-x-2">
        <button
            id="history-btn"
            type="button"
            aria-label="历史记录与菜单"
            class="w-9 h-9 shrink-0 flex items-center justify-center rounded-xl bg-slate-800 text-slate-300 active:scale-95 transition"
        >
            <i class="fa-solid fa-bars"></i>
        </button>
        <div class="min-w-0">
            <h1
                id="current-title"
                class="text-sm sm:text-base font-semibold tracking-wide truncate"
            >
                AI 对话中心
            </h1>
            <div
                id="active-deployment-label"
                class="hidden text-[10px] text-indigo-400 truncate mt-0.5"
            ></div>
        </div>
    </div>
    <div class="flex items-center shrink-0 space-x-2 sm:space-x-3">
        <div
            class="text-[10px] sm:text-xs bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 px-2 sm:px-2.5 py-1 rounded-full font-mono whitespace-nowrap"
        >
            <span class="hidden sm:inline">用量: </span>
            <span id="token-count">0</span>
            <span> tokens</span>
        </div>
        <button
            id="export-btn"
            type="button"
            aria-label="导出聊天记录"
            class="w-9 h-9 flex items-center justify-center rounded-xl bg-indigo-600 text-white active:scale-95 transition"
        >
            <i class="fa-solid fa-download text-sm"></i>
        </button>
    </div>
</header>
<!-- ============================== -->
<!-- Chat -->
<!-- ============================== -->
<main
    id="chat-container"
    class="flex-1 relative overflow-y-auto overscroll-contain p-4 space-y-4"
    style="padding-bottom: 110px;"
></main>
<!-- ============================== -->
<!-- Composer -->
<!-- ============================== -->
<nav
    class="composer-shell shrink-0 px-3 pt-3 bg-slate-900/95 border-t border-slate-800 backdrop-blur-lg z-20"
>
    <div class="flex items-center space-x-2">
        <input
            type="text"
            id="user-input"
            autocomplete="off"
            autocapitalize="sentences"
            enterkeyhint="send"
            placeholder="输入消息..."
            class="flex-1 min-w-0 bg-slate-800 text-slate-100 placeholder-slate-500 text-base rounded-xl px-4 py-3 border border-slate-700/60 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/30 transition"
        >
        <button
            id="send-btn"
            type="button"
            aria-label="发送消息"
            class="w-12 h-12 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl flex items-center justify-center shrink-0 active:scale-95 transition shadow-lg shadow-indigo-600/30"
        >
            <i id="send-icon" class="fa-solid fa-paper-plane"></i>
            <span
                id="send-stop-icon"
                class="hidden"
            >
                <i class="fa-solid fa-stop"></i>
            </span>
        </button>
    </div>
</nav>
<!-- ============================== -->
<!-- Drawer -->
<!-- ============================== -->
<div
    id="history-drawer"
    class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden"
    aria-hidden="true"
>
    <aside
        id="history-panel"
        class="absolute left-0 top-0 bottom-0 w-4/5 max-w-xs bg-slate-900 border-r border-slate-800 p-4 flex flex-col safe-top safe-bottom"
    >
        <div
            class="flex items-center justify-between pb-3 border-b border-slate-800 mb-3"
        >
            <h2
                class="text-sm font-semibold text-slate-200 flex items-center space-x-2"
            >
                <i class="fa-solid fa-compass text-indigo-400"></i>
                <span>控制台菜单</span>
            </h2>
            <button
                id="close-drawer"
                type="button"
                aria-label="关闭菜单"
                class="text-slate-400 hover:text-white w-8 h-8 flex items-center justify-center rounded-lg hover:bg-slate-800"
            >
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>
        <button
            id="new-chat-btn"
            type="button"
            class="w-full mb-3 py-2.5 px-4 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-sm font-medium flex items-center space-x-2 shadow-lg shadow-indigo-600/20 active:scale-[0.98] transition"
        >
            <i class="fa-solid fa-plus"></i>
            <span>开启新话题</span>
        </button>
        <!-- Deployments -->
        <div class="space-y-1.5 mb-3 pb-3 border-b border-slate-800">
            <div
                class="text-[11px] font-semibold text-slate-500 uppercase tracking-wider px-1 mb-1"
            >
                系统功能
            </div>
            <button
                id="deploy-skill-btn"
                type="button"
                class="w-full py-2 px-3 bg-slate-800/50 hover:bg-slate-800 text-slate-300 rounded-xl text-xs flex items-center justify-between transition"
            >
                <span class="flex items-center space-x-2">
                    <i class="fa-solid fa-wand-magic-sparkles text-indigo-400"></i>
                    <span>部署 Skill</span>
                </span>
                <i class="fa-solid fa-plus text-[10px] text-slate-500"></i>
            </button>
            <button
                id="deploy-agent-btn"
                type="button"
                class="w-full py-2 px-3 bg-slate-800/50 hover:bg-slate-800 text-slate-300 rounded-xl text-xs flex items-center justify-between transition"
            >
                <span class="flex items-center space-x-2">
                    <i class="fa-solid fa-brain text-emerald-400"></i>
                    <span>部署 Agent</span>
                </span>
                <i class="fa-solid fa-plus text-[10px] text-slate-500"></i>
            </button>
        </div>
        <div
            id="deployed-section"
            class="space-y-2 mb-3 pb-3 border-b border-slate-800 hidden"
        >
            <div
                class="text-[11px] font-semibold text-slate-500 uppercase tracking-wider px-1"
            >
                我的技能与智能体
            </div>
            <div
                id="deployed-list"
                class="space-y-1"
            ></div>
        </div>
        <!-- Sessions -->
        <div
            class="text-[11px] font-semibold text-slate-500 uppercase tracking-wider px-1 mb-1"
        >
            历史对话
        </div>
        <div
            id="history-list"
            class="flex-1 overflow-y-auto space-y-2 pr-0.5"
        ></div>
    </aside>
</div>
<!-- ============================== -->
<!-- Deployment Modal -->
<!-- ============================== -->
<div
    id="config-modal"
    class="modal-overlay fixed inset-0 bg-black/70 backdrop-blur-sm z-[60] hidden flex items-center justify-center p-4"
    aria-hidden="true"
>
    <div
        class="modal-panel bg-slate-900 border border-slate-800 w-full max-w-sm rounded-2xl p-5 shadow-2xl space-y-4"
    >
        <div
            class="flex items-center justify-between pb-2 border-b border-slate-800"
        >
            <h3
                id="modal-title"
                class="text-sm font-semibold text-slate-200"
            >
                配置
            </h3>
            <button
                id="close-modal"
                type="button"
                aria-label="关闭"
                class="text-slate-400 hover:text-white w-7 h-7 flex items-center justify-center rounded-lg hover:bg-slate-800"
            >
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div class="space-y-3">
            <div>
                <label
                    for="modal-name-input"
                    class="block text-xs font-medium text-slate-400 mb-1"
                >
                    名称
                </label>
                <input
                    type="text"
                    id="modal-name-input"
                    maxlength="50"
                    class="w-full bg-slate-800 text-slate-100 text-sm rounded-xl px-3 py-2 border border-slate-700 focus:border-indigo-500 focus:outline-none"
                    placeholder="例如：专业翻译"
                >
            </div>
            <div>
                <label
                    for="modal-desc-input"
                    class="block text-xs font-medium text-slate-400 mb-1"
                >
                    设定 / 系统提示词
                </label>
                <textarea
                    id="modal-desc-input"
                    rows="5"
                    maxlength="20000"
                    class="w-full bg-slate-800 text-slate-100 text-sm rounded-xl px-3 py-2 border border-slate-700 focus:border-indigo-500 focus:outline-none resize-none"
                    placeholder="输入具体的行为设定或规则..."
                ></textarea>
                <div class="text-right text-[10px] text-slate-600 mt-1">
                    <span id="prompt-length">0</span>/20000
                </div>
            </div>
        </div>
        <div class="flex space-x-2 pt-2">
            <button
                id="modal-cancel-btn"
                type="button"
                class="flex-1 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-medium transition"
            >
                取消
            </button>
            <button
                id="modal-save-btn"
                type="button"
                class="flex-1 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-medium transition shadow-lg shadow-indigo-600/30"
            >
                确认部署
            </button>
        </div>
    </div>
</div>
<!-- ============================== -->
<!-- Delete Session Modal -->
<!-- ============================== -->
<div
    id="session-delete-modal"
    class="modal-overlay fixed inset-0 bg-black/70 backdrop-blur-sm z-[70] hidden flex items-center justify-center p-4"
    aria-hidden="true"
>
    <div
        class="modal-panel bg-slate-900 border border-slate-800 w-full max-w-sm rounded-2xl p-5 shadow-2xl"
    >
        <div class="flex items-start space-x-3">
            <div
                class="w-9 h-9 rounded-xl bg-red-500/10 border border-red-500/20 flex items-center justify-center shrink-0"
            >
                <i class="fa-solid fa-trash text-red-400 text-sm"></i>
            </div>
            <div class="min-w-0">
                <h3
                    class="text-sm font-semibold text-slate-200"
                >
                    删除会话
                </h3>
                <p
                    id="delete-session-title"
                    class="text-xs text-slate-500 mt-1 line-clamp-2"
                ></p>
                <p
                    class="text-xs text-slate-400 mt-2"
                >
                    删除后无法恢复，确定继续吗？
                </p>
            </div>
        </div>
        <div class="flex space-x-2 mt-5">
            <button
                id="delete-cancel-btn"
                type="button"
                class="flex-1 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-medium transition"
            >
                取消
            </button>
            <button
                id="delete-confirm-btn"
                type="button"
                class="flex-1 py-2 bg-red-600 hover:bg-red-500 text-white rounded-xl text-xs font-medium transition"
            >
                删除
            </button>
        </div>
    </div>
</div>
</div>
<script>
/* =========================================================
   AI Console v3.0
   ========================================================= */
(() => {
    'use strict';
    /* =====================================================
       Constants
       ===================================================== */
    const STORAGE_KEY = 'ai_console_state';
    const STORAGE_VERSION = 3;
    const REQUEST_TIMEOUT = 30000;
    const MAX_SESSIONS = 100;
    const MAX_DEPLOYMENTS = 100;
    const MAX_MESSAGES_PER_SESSION = 100;
    const MAX_MESSAGE_LENGTH = 20000;
    /* =====================================================
       DOM
       ===================================================== */
    const app = document.getElementById('app');
    const chatContainer =
        document.getElementById('chat-container');
    const userInput =
        document.getElementById('user-input');
    const sendBtn =
        document.getElementById('send-btn');
    const sendIcon =
        document.getElementById('send-icon');
    const sendStopIcon =
        document.getElementById('send-stop-icon');
    const tokenCountEl =
        document.getElementById('token-count');
    const exportBtn =
        document.getElementById('export-btn');
    const historyBtn =
        document.getElementById('history-btn');
    const historyDrawer =
        document.getElementById('history-drawer');
    const historyPanel =
        document.getElementById('history-panel');
    const closeDrawer =
        document.getElementById('close-drawer');
    const historyList =
        document.getElementById('history-list');
    const newChatBtn =
        document.getElementById('new-chat-btn');
    const currentTitleEl =
        document.getElementById('current-title');
    const activeDeploymentLabel =
        document.getElementById(
            'active-deployment-label'
        );
    const deploySkillBtn =
        document.getElementById('deploy-skill-btn');
    const deployAgentBtn =
        document.getElementById('deploy-agent-btn');
    const deployedSection =
        document.getElementById('deployed-section');
    const deployedList =
        document.getElementById('deployed-list');
    const configModal =
        document.getElementById('config-modal');
    const closeModal =
        document.getElementById('close-modal');
    const modalCancelBtn =
        document.getElementById('modal-cancel-btn');
    const modalSaveBtn =
        document.getElementById('modal-save-btn');
    const modalTitle =
        document.getElementById('modal-title');
    const modalNameInput =
        document.getElementById('modal-name-input');
    const modalDescInput =
        document.getElementById('modal-desc-input');
    const promptLength =
        document.getElementById('prompt-length');
    const sessionDeleteModal =
        document.getElementById(
            'session-delete-modal'
        );
    const deleteSessionTitle =
        document.getElementById(
            'delete-session-title'
        );
    const deleteCancelBtn =
        document.getElementById(
            'delete-cancel-btn'
        );
    const deleteConfirmBtn =
        document.getElementById(
            'delete-confirm-btn'
        );
    /* =====================================================
       State
       ===================================================== */
    let state = createDefaultState();
    let isSending = false;
    let currentAbortController = null;
    let currentRequestTimeout = null;
    let deploymentModalType = 'skill';
    let pendingDeleteSessionId = null;
    /* =====================================================
       State Factory
       ===================================================== */
    function createDefaultState() {
        return {
            version: STORAGE_VERSION,
            sessions: [],
            currentSessionId: null,
            deployedItems: [],
            usage: {
                promptTokens: 0,
                completionTokens: 0,
                totalTokens: 0
            }
        };
    }
    function createSession() {
        const now = Date.now();
        return {
            id:
                'session_' +
                now +
                '_' +
                Math.random()
                    .toString(36)
                    .slice(2, 8),
            title: '新对话',
            createdAt: now,
            updatedAt: now,
            messages: [],
            activeDeploymentId: null
        };
    }
    function createDeployment(type, name, prompt) {
        return {
            id:
                'deployment_' +
                Date.now() +
                '_' +
                Math.random()
                    .toString(36)
                    .slice(2, 8),
            type,
            name,
            prompt,
            createdAt: Date.now()
        };
    }
    /* =====================================================
       Storage
       ===================================================== */
    function safeParse(value) {
        try {
            return JSON.parse(value);
        } catch {
            return null;
        }
    }
    function normalizeMessage(message) {
        if (
            !message ||
            typeof message !== 'object'
        ) {
            return null;
        }
        const allowedRoles = new Set([
            'user',
            'assistant'
        ]);
        if (
            !allowedRoles.has(message.role)
        ) {
            return null;
        }
        if (
            typeof message.content !== 'string'
        ) {
            return null;
        }
        const content =
            message.content.slice(
                0,
                MAX_MESSAGE_LENGTH
            );
        return {
            role: message.role,
            content
        };
    }
    function normalizeSession(session) {
        if (
            !session ||
            typeof session !== 'object'
        ) {
            return null;
        }
        if (
            typeof session.id !== 'string'
        ) {
            return null;
        }
        const messages = Array.isArray(
            session.messages
        )
            ? session.messages
                  .map(normalizeMessage)
                  .filter(Boolean)
                  .slice(
                      -MAX_MESSAGES_PER_SESSION
                  )
            : [];
        return {
            id: session.id,
            title:
                typeof session.title === 'string'
                    ? session.title.slice(0, 80)
                    : '新对话',
            createdAt:
                Number.isFinite(session.createdAt)
                    ? session.createdAt
                    : Date.now(),
            updatedAt:
                Number.isFinite(session.updatedAt)
                    ? session.updatedAt
                    : Date.now(),
            messages,
            activeDeploymentId:
                typeof session.activeDeploymentId ===
                'string'
                    ? session.activeDeploymentId
                    : null
        };
    }
    function normalizeDeployment(item) {
        if (
            !item ||
            typeof item !== 'object'
        ) {
            return null;
        }
        if (
            (item.type !== 'skill' &&
                item.type !== 'agent') ||
            typeof item.name !== 'string' ||
            typeof item.prompt !== 'string'
        ) {
            return null;
        }
        return {
            id:
                typeof item.id === 'string'
                    ? item.id
                    : 'deployment_' +
                      Date.now() +
                      '_' +
                      Math.random()
                          .toString(36)
                          .slice(2, 8),
            type: item.type,
            name: item.name.slice(0, 50),
            prompt: item.prompt.slice(
                0,
                20000
            ),
            createdAt:
                Number.isFinite(item.createdAt)
                    ? item.createdAt
                    : Date.now()
        };
    }
    function migrateState(raw) {
        const next = createDefaultState();
        if (
            !raw ||
            typeof raw !== 'object'
        ) {
            return next;
        }
        /*
         * v3
         */
        if (raw.version === STORAGE_VERSION) {
            next.sessions = Array.isArray(
                raw.sessions
            )
                ? raw.sessions
                      .map(normalizeSession)
                      .filter(Boolean)
                      .slice(-MAX_SESSIONS)
                : [];
            next.currentSessionId =
                typeof raw.currentSessionId ===
                'string'
                    ? raw.currentSessionId
                    : null;
            next.deployedItems = Array.isArray(
                raw.deployedItems
            )
                ? raw.deployedItems
                      .map(normalizeDeployment)
                      .filter(Boolean)
                      .slice(-MAX_DEPLOYMENTS)
                : [];
            const usage =
                raw.usage || {};
            next.usage = {
                promptTokens:
                    Number.isFinite(
                        usage.promptTokens
                    )
                        ? usage.promptTokens
                        : 0,
                completionTokens:
                    Number.isFinite(
                        usage.completionTokens
                    )
                        ? usage.completionTokens
                        : 0,
                totalTokens:
                    Number.isFinite(
                        usage.totalTokens
                    )
                        ? usage.totalTokens
                        : 0
            };
            return next;
        }
        /*
         * v1 / v2 migration:
         * chat_messages -> one session
         */
        if (
            Array.isArray(raw.chat_messages)
        ) {
            const migratedMessages =
                raw.chat_messages
                    .map(normalizeMessage)
                    .filter(Boolean);
            if (migratedMessages.length) {
                const session =
                    createSession();
                session.messages =
                    migratedMessages.slice(
                        -MAX_MESSAGES_PER_SESSION
                    );
                session.title =
                    generateSessionTitle(
                        session.messages
                    );
                next.sessions.push(session);
                next.currentSessionId =
                    session.id;
            }
        }
        if (
            Array.isArray(
                raw.deployed_items
            )
        ) {
            next.deployedItems =
                raw.deployed_items
                    .map(normalizeDeployment)
                    .filter(Boolean)
                    .slice(-MAX_DEPLOYMENTS);
        }
        if (
            Number.isFinite(
                raw.total_tokens
            )
        ) {
            next.usage.totalTokens =
                raw.total_tokens;
        }
        return next;
    }
    function loadState() {
        try {
            const rawValue =
                localStorage.getItem(
                    STORAGE_KEY
                );
            if (rawValue) {
                const raw =
                    safeParse(rawValue);
                state =
                    migrateState(raw);
            } else {
                state =
                    createDefaultState();
            }
        } catch (error) {
            console.error(
                'Storage load error:',
                error
            );
            state =
                createDefaultState();
        }
        ensureCurrentSession();
        saveState();
    }
    function saveState() {
        try {
            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(state)
            );
        } catch (error) {
            console.error(
                'Storage save error:',
                error
            );
        }
    }

    /* =====================================================
       Session Helpers
       ===================================================== */
    function getCurrentSession() {
        return state.sessions.find(
            session =>
                session.id ===
                state.currentSessionId
        ) || null;
    }
    function ensureCurrentSession() {
        if (
            state.sessions.length === 0
        ) {
            const session =
                createSession();
            state.sessions.push(
                session
            );
            state.currentSessionId =
                session.id;
            return;
        }
        const exists =
            state.sessions.some(
                session =>
                    session.id ===
                    state.currentSessionId
            );
        if (!exists) {
            state.currentSessionId =
                state.sessions[
                    state.sessions.length - 1
                ].id;
        }
    }
    function generateSessionTitle(messages) {
        const firstUserMessage =
            messages.find(
                message =>
                    message.role === 'user'
            );
        if (
            !firstUserMessage ||
            !firstUserMessage.content
        ) {
            return '新对话';
        }
        const clean =
            firstUserMessage.content
                .replace(/\s+/g, ' ')
                .trim();
        if (!clean) {
            return '新对话';
        }
        return clean.length > 28
            ? clean.slice(0, 28) + '…'
            : clean;
    }
    function updateSessionTimestamp(
        session
    ) {
        session.updatedAt =
            Date.now();
    }
    function createNewSession() {
        if (isSending) {
            return;
        }
        const session =
            createSession();
        state.sessions.push(
            session
        );
        if (
            state.sessions.length >
            MAX_SESSIONS
        ) {
            state.sessions =
                state.sessions.slice(
                    -MAX_SESSIONS
                );
        }
        state.currentSessionId =
            session.id;
        saveState();
        renderEverything();
        closeHistory();
        requestAnimationFrame(() => {
            userInput.focus();
        });
    }
    function switchSession(sessionId) {
        if (isSending) {
            return;
        }
        const session =
            state.sessions.find(
                item =>
                    item.id ===
                    sessionId
            );
        if (!session) {
            return;
        }
        state.currentSessionId =
            session.id;
        saveState();
        renderEverything();
        closeHistory();
    }
    function openDeleteSessionModal(
        sessionId
    ) {
        const session =
            state.sessions.find(
                item =>
                    item.id ===
                    sessionId
            );
        if (!session) {
            return;
        }
        pendingDeleteSessionId =
            sessionId;
        deleteSessionTitle.textContent =
            session.title;
        sessionDeleteModal.classList.remove(
            'hidden'
        );
        sessionDeleteModal.setAttribute(
            'aria-hidden',
            'false'
        );
    }
    function closeDeleteSessionModal() {
        pendingDeleteSessionId =
            null;
        sessionDeleteModal.classList.add(
            'hidden'
        );
        sessionDeleteModal.setAttribute(
            'aria-hidden',
            'true'
        );
    }
    function deleteSession() {
        if (
            !pendingDeleteSessionId
        ) {
            return;
        }
        const deletingId =
            pendingDeleteSessionId;
        state.sessions =
            state.sessions.filter(
                session =>
                    session.id !==
                    deletingId
            );
        if (
            state.currentSessionId ===
            deletingId
        ) {
            if (
                state.sessions.length
            ) {
                const newest =
                    [...state.sessions]
                        .sort(
                            (a, b) =>
                                b.updatedAt -
                                a.updatedAt
                        )[0];
                state.currentSessionId =
                    newest.id;
            } else {
                const newSession =
                    createSession();
                state.sessions.push(
                    newSession
                );
                state.currentSessionId =
                    newSession.id;
            }
        }
        saveState();
        closeDeleteSessionModal();
        renderEverything();
    }
    /* =====================================================
       Deployment Helpers
       ===================================================== */
    function getActiveDeployment() {
        const session =
            getCurrentSession();
        if (
            !session ||
            !session.activeDeploymentId
        ) {
            return null;
        }
        return (
            state.deployedItems.find(
                item =>
                    item.id ===
                    session.activeDeploymentId
            ) || null
        );
    }
    function activateDeployment(
        deploymentId
    ) {
        if (isSending) {
            return;
        }
        const session =
            getCurrentSession();
        const deployment =
            state.deployedItems.find(
                item =>
                    item.id ===
                    deploymentId
            );
        if (
            !session ||
            !deployment
        ) {
            return;
        }
        session.activeDeploymentId =
            deployment.id;
        updateSessionTimestamp(
            session
        );
        saveState();
        renderEverything();
        closeHistory();
    }
    function removeDeployment(
        deploymentId
    ) {
        if (isSending) {
            return;
        }
        state.deployedItems =
            state.deployedItems.filter(
                item =>
                    item.id !==
                    deploymentId
            );
        state.sessions.forEach(
            session => {
                if (
                    session.activeDeploymentId ===
                    deploymentId
                ) {
                    session.activeDeploymentId =
                        null;
                }
            }
        );
        saveState();
        renderEverything();
    }

    function formatDate(timestamp) {
        const date =
            new Date(timestamp);
        const now =
            new Date();
        const sameDay =
            date.getFullYear() ===
                now.getFullYear() &&
            date.getMonth() ===
                now.getMonth() &&
            date.getDate() ===
                now.getDate();
        if (sameDay) {
            return date.toLocaleTimeString(
                'zh-CN',
                {
                    hour: '2-digit',
                    minute: '2-digit'
                }
            );
        }
        return date.toLocaleDateString(
            'zh-CN',
            {
                month: 'numeric',
                day: 'numeric'
            }
        );
    }

    function getDateGroup(
        timestamp
    ) {
        const date =
            new Date(timestamp);
        const now =
            new Date();
        const startToday =
            new Date(
                now.getFullYear(),
                now.getMonth(),
                now.getDate()
            ).getTime();
        const startYesterday =
            startToday -
            86400000;
        if (
            timestamp >=
            startToday
        ) {
            return '今天';
        }
        if (
            timestamp >=
            startYesterday
        ) {
            return '昨天';
        }
        return date.toLocaleDateString(
            'zh-CN',
            {
                year: 'numeric',
                month: 'long'
            }
        );
    }

    function buildApiMessages(
        session
    ) {
        const result = [];
        const deployment =
            getActiveDeployment();
        /*
         * System Prompt MUST be added on
         * every request, not only the first.
         */
        if (
            deployment &&
            deployment.prompt
        ) {
            result.push({
                role: 'system',
                content:
                    deployment.prompt
            });
        }
        session.messages.forEach(
            message => {
                const normalized =
                    normalizeMessage(
                        message
                    );
                if (normalized) {
                    result.push(
                        normalized
                    );
                }
            }
        );
        return result;
    }

    ) {
        isSending = sending;
        userInput.disabled =
            sending;
        sendBtn.disabled = false;
        if (sending) {
            sendIcon.classList.add(
                'hidden'
            );
            sendStopIcon.classList.remove(
                'hidden'
            );
            sendBtn.classList.remove(
                'bg-indigo-600'
            );
            sendBtn.classList.add(
                'bg-red-600',
                'hover:bg-red-500'
            );
            sendBtn.setAttribute(
                'aria-label',
                '停止生成'
            );
        } else {
            sendIcon.classList.remove(
                'hidden'
            );
            sendStopIcon.classList.add(
                'hidden'
            );
            sendBtn.classList.remove(
                'bg-red-600',
                'hover:bg-red-500'
            );
            sendBtn.classList.add(
                'bg-indigo-600'
            );
            sendBtn.setAttribute(
                'aria-label',
                '发送消息'
            );
            userInput.disabled =
                false;
        }
    }
    async function handleSend() {
        if (isSending) {
            return;
        }
        const text =
            userInput.value.trim();
        if (!text) {
            return;
        }
        if (
            text.length >
            MAX_MESSAGE_LENGTH
        ) {
            appendErrorMessage(
                `消息过长，不能超过 ${MAX_MESSAGE_LENGTH} 个字符。`
            );
            return;
        }
        const session =
            getCurrentSession();
        if (!session) {
            return;
        }
        userInput.value = '';
        appendLocalMessage(
            'user',
            text
        );
        createLoading();
        setSendingUI(true);
        currentAbortController =
            new AbortController();
        currentRequestTimeout =
            setTimeout(() => {
                if (
                    currentAbortController
                ) {
                    currentAbortController.abort(
                        'timeout'
                    );
                }
            }, REQUEST_TIMEOUT);
        try {
            const finalMessages =
                buildApiMessages(
                    session
                );
            const response =
                await fetch(
                    '/api/chat',
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type':
                                'application/json',
                            Accept:
                                'application/json'
                        },
                        body:
                            JSON.stringify({
                                messages:
                                    finalMessages
                            }),
                        signal:
                            currentAbortController
                                .signal
                    }
                );
            let data = null;
            try {
                data =
                    await response.json();
            } catch {
                throw new Error(
                    `服务器返回了无法解析的数据（HTTP ${response.status}）`
                );
            }
            removeLoading();
            if (!response.ok) {
                const errorObject =
                    data?.error;
                let message =
                    '服务器请求失败';
                if (
                    typeof errorObject ===
                    'string'
                ) {
                    message =
                        errorObject;
                } else if (
                    errorObject?.message
                ) {
                    message =
                        errorObject.message;
                }
                appendErrorMessage(
                    message
                );
                return;
            }
            if (
                data?.success === false
            ) {
                const errorObject =
                    data?.error;
                appendErrorMessage(
                    typeof errorObject ===
                        'string'
                        ? errorObject
                        : errorObject?.message ||
                              'AI 请求失败'
                );
                return;
            }
            const reply =
                typeof data?.reply ===
                'string'
                    ? data.reply
                    : data?.choices?.[0]
                          ?.message
                          ?.content;
            if (
                typeof reply !==
                    'string' ||
                !reply.trim()
            ) {
                appendErrorMessage(
                    '未获取到有效的 AI 回复。'
                );
                return;
            }
            /*
             * Save assistant response.
             */
            const current =
                getCurrentSession();
            if (current) {
                current.messages.push({
                    role:
                        'assistant',
                    content:
                        reply
                });
                if (
                    current.messages
                        .length >
                    MAX_MESSAGES_PER_SESSION
                ) {
                    current.messages =
                        current.messages.slice(
                            -MAX_MESSAGES_PER_SESSION
                        );
                }
                updateSessionTimestamp(
                    current
                );
            }
            /*
             * Real token usage from backend.
             */
            if (
                data?.usage &&
                typeof data.usage ===
                    'object'
            ) {
                const usage =
                    data.usage;
                const promptTokens =
                    Number(
                        usage.prompt_tokens
                    ) || 0;
                const completionTokens =
                    Number(
                        usage.completion_tokens
                    ) || 0;
                const totalTokens =
                    Number(
                        usage.total_tokens
                    ) || 0;
                state.usage.promptTokens +=
                    promptTokens;
                state.usage.completionTokens +=
                    completionTokens;
                state.usage.totalTokens +=
                    totalTokens;
                renderUsage();
            }
            appendMessageUI(
                'assistant',
                reply
            );
            saveState();
            renderHeader();
            renderHistoryList();
        } catch (error) {
            removeLoading();
            /*
             * User manually cancelled.
             */
            if (
                error?.name ===
                'AbortError'
            ) {
                const reason =
                    currentAbortController?.signal
                        ?.reason;
                if (
                    reason ===
                    'timeout'
                ) {
                    appendErrorMessage(
                        'AI 服务响应超时，请稍后重试。'
                    );
                } else {
                    appendErrorMessage(
                        '已停止本次生成。'
                    );
                }
                return;
            }
            if (
                error?.message ===
                'Failed to fetch'
            ) {
                appendErrorMessage(
                    '网络连接异常，请检查网络后重试。'
                );
                return;
            }
            appendErrorMessage(
                error?.message ||
                    '网络请求异常，请稍后重试。'
            );
        } finally {
            if (
                currentRequestTimeout
            ) {
                clearTimeout(
                    currentRequestTimeout
                );
                currentRequestTimeout =
                    null;
            }
            currentAbortController =
                null;
            setSendingUI(false);
            requestAnimationFrame(() => {
                userInput.focus();
            });
        }
    }
    function abortCurrentRequest() {
        if (
            !isSending ||
            !currentAbortController
        ) {
            return;
        }
        currentAbortController.abort(
            'manual'
        );
    }
    /* =====================================================
       Scroll / Viewport
       ===================================================== */
    function scrollToBottom(
        smooth = true
    ) {
        requestAnimationFrame(() => {
            chatContainer.scrollTo({
                top:
                    chatContainer.scrollHeight,
                behavior:
                    smooth
                        ? 'smooth'
                        : 'auto'
            });
        });
    }
    function updateViewportHeight() {
        if (
            !window.visualViewport
        ) {
            document.documentElement.style.setProperty(
                '--viewport-height',
                '100dvh'
            );
            return;
        }
        const viewport =
            window.visualViewport;
        const height =
            viewport.height;
        const keyboardHeight =
            Math.max(
                0,
                window.innerHeight -
                    height
            );
        document.documentElement.style.setProperty(
            '--viewport-height',
            `${height}px`
        );
        document.documentElement.style.setProperty(
            '--keyboard-height',
            `${keyboardHeight}px`
        );
        if (
            keyboardHeight > 120
        ) {
            app.classList.add(
                'keyboard-active'
            );
        } else {
            app.classList.remove(
                'keyboard-active'
            );
        }
        if (isSending) {
            scrollToBottom(
                false
            );
        }
    }
    /* =====================================================
       Drawer
       ===================================================== */
    function openHistory() {
        renderHistoryList();
        historyDrawer.classList.remove(
            'hidden'
        );
        historyDrawer.setAttribute(
            'aria-hidden',
            'false'
        );
        requestAnimationFrame(() => {
            historyPanel.focus?.();
        });
    }
    function closeHistory() {
        historyDrawer.classList.add(
            'hidden'
        );
        historyDrawer.setAttribute(
            'aria-hidden',
            'true'
        );
    }
    /* =====================================================
       Deployment Modal
       ===================================================== */
    function updatePromptLength() {
        promptLength.textContent =
            String(
                modalDescInput.value.length
            );
    }
    function openConfigModal(
        type
    ) {
        if (isSending) {
            return;
        }
        deploymentModalType =
            type;
        modalTitle.textContent =
            type === 'skill'
                ? '部署新 Skill（技能）'
                : '部署新 Agent（智能体）';
        modalNameInput.value =
            '';
        modalDescInput.value =
            '';
        modalNameInput.placeholder =
            type === 'skill'
                ? '例如：代码审查助手'
                : '例如：全栈架构师';
        modalDescInput.placeholder =
            type === 'skill'
                ? '输入该技能的具体提示词规则...'
                : '输入该智能体的人设与背景描述...';
        updatePromptLength();
        configModal.classList.remove(
            'hidden'
        );
        configModal.setAttribute(
            'aria-hidden',
            'false'
        );
        closeHistory();
        requestAnimationFrame(() => {
            modalNameInput.focus();
        });
    }
    function closeConfigModal() {
        configModal.classList.add(
            'hidden'
        );
        configModal.setAttribute(
            'aria-hidden',
            'true'
        );
    }
    function saveDeployment() {
        const name =
            modalNameInput.value.trim();
        const prompt =
            modalDescInput.value.trim();
        if (!name) {
            modalNameInput.focus();
            return;
        }
        if (!prompt) {
            modalDescInput.focus();
            return;
        }
        if (
            name.length > 50
        ) {
            appendErrorMessage(
                '名称不能超过 50 个字符。'
            );
            closeConfigModal();
            return;
        }
        const deployment =
            createDeployment(
                deploymentModalType,
                name,
                prompt
            );
        state.deployedItems.push(
            deployment
        );
        if (
            state.deployedItems.length >
            MAX_DEPLOYMENTS
        ) {
            state.deployedItems =
                state.deployedItems.slice(
                    -MAX_DEPLOYMENTS
                );
        }
        const session =
            getCurrentSession();
        if (session) {
            session.activeDeploymentId =
                deployment.id;
            updateSessionTimestamp(
                session
            );
        }
        saveState();
        closeConfigModal();
        renderEverything();
    }
    /* =====================================================
       Export
       ===================================================== */
    function downloadJSON(
        data,
        filename
    ) {
        try {
            const json =
                JSON.stringify(
                    data,
                    null,
                    2
                );
            const blob =
                new Blob(
                    [json],
                    {
                        type:
                            'application/json;charset=utf-8'
                    }
                );
            const url =
                URL.createObjectURL(
                    blob
                );
            const anchor =
                document.createElement(
                    'a'
                );
            anchor.href =
                url;
            anchor.download =
                filename;
            document.body.appendChild(
                anchor
            );
            anchor.click();
            anchor.remove();
            setTimeout(() => {
                URL.revokeObjectURL(
                    url
                );
            }, 1000);
        } catch (error) {
            console.error(
                'Export error:',
                error
            );
            appendErrorMessage(
                '导出失败，请稍后重试。'
            );
        }
    }
    function exportWorkspace() {
        downloadJSON(
            {
                exportedAt:
                    new Date().toISOString(),
                version:
                    STORAGE_VERSION,
                sessions:
                    state.sessions,
                deployedItems:
                    state.deployedItems,
                usage:
                    state.usage
            },
            `ai_workspace_${Date.now()}.json`
        );
    }
    /* =====================================================
       Events
       ===================================================== */
    historyBtn.addEventListener(
        'click',
        openHistory
    );
    closeDrawer.addEventListener(
        'click',
        closeHistory
    );
    historyDrawer.addEventListener(
        'click',
        event => {
            if (
                event.target ===
                historyDrawer
            ) {
                closeHistory();
            }
        }
    );
    newChatBtn.addEventListener(
        'click',
        createNewSession
    );
    deploySkillBtn.addEventListener(
        'click',
        () => {
            openConfigModal(
                'skill'
            );
        }
    );
    deployAgentBtn.addEventListener(
        'click',
        () => {
            openConfigModal(
                'agent'
            );
        }
    );
    closeModal.addEventListener(
        'click',
        closeConfigModal
    );
    modalCancelBtn.addEventListener(
        'click',
        closeConfigModal
    );
    modalSaveBtn.addEventListener(
        'click',
        saveDeployment
    );
    modalDescInput.addEventListener(
        'input',
        updatePromptLength
    );
    deleteCancelBtn.addEventListener(
        'click',
        closeDeleteSessionModal
    );
    deleteConfirmBtn.addEventListener(
        'click',
        deleteSession
    );
    sessionDeleteModal.addEventListener(
        'click',
        event => {
            if (
                event.target ===
                sessionDeleteModal
            ) {
                closeDeleteSessionModal();
            }
        }
    );
    configModal.addEventListener(
        'click',
        event => {
            if (
                event.target ===
                configModal
            ) {
                closeConfigModal();
            }
        }
    );
    sendBtn.addEventListener(
        'click',
        () => {
            if (isSending) {
                abortCurrentRequest();
            } else {
                handleSend();
            }
        }
    );
    userInput.addEventListener(
        'keydown',
        event => {
            if (
                event.key ===
                    'Enter' &&
                !event.shiftKey
            ) {
                event.preventDefault();
                if (!isSending) {
                    handleSend();
                }
            }
        }
    );
    exportBtn.addEventListener(
        'click',
        exportWorkspace
    );
    document.addEventListener(
        'keydown',
        event => {
            if (
                event.key !==
                'Escape'
            ) {
                return;
            }
            if (
                !configModal.classList.contains(
                    'hidden'
                )
            ) {
                closeConfigModal();
                return;
            }
            if (
                !sessionDeleteModal.classList.contains(
                    'hidden'
                )
            ) {
                closeDeleteSessionModal();
                return;
            }
            if (
                !historyDrawer.classList.contains(
                    'hidden'
                )
            ) {
                closeHistory();
            }
        }
    );
    /* =====================================================
       VisualViewport
       ===================================================== */
    if (
        window.visualViewport
    ) {
        window.visualViewport.addEventListener(
            'resize',
            updateViewportHeight
        );
        window.visualViewport.addEventListener(
            'scroll',
            updateViewportHeight
        );
    }
    window.addEventListener(
        'resize',
        updateViewportHeight
    );
    /* =====================================================
       Initial Boot
       ===================================================== */
    loadState();
    updateViewportHeight();
    renderEverything();
})();
</script>
</body>
</html>
