
<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    >

    <meta name="theme-color" content="#020617">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <title>CQS AI</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        rel="stylesheet"
    >

    <style>

        /* =========================================================
           CORE
        ========================================================= */

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;

            overflow: hidden;

            background: #020617;

            overscroll-behavior: none;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;

            color: #f8fafc;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        ::-webkit-scrollbar {
            width: 0;
            height: 0;
            display: none;
        }

        * {
            scrollbar-width: none;
        }

        .safe-top {
            padding-top: env(safe-area-inset-top);
        }

        .safe-bottom {
            padding-bottom: env(safe-area-inset-bottom);
        }

        input,
        textarea,
        button {
            font-size: 16px;
        }

        button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        #user-input {
            -webkit-appearance: none;
            appearance: none;
        }

        #user-input:focus {
            outline: none;
        }


        /* =========================================================
           MESSAGE
        ========================================================= */

        .message-enter {
            animation: messageEnter 0.22s ease-out;
        }

        @keyframes messageEnter {

            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        /* =========================================================
           THINKING DOT
        ========================================================= */

        .typing-dot {
            animation: typing 1.2s infinite ease-in-out;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.15s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.30s;
        }

        @keyframes typing {

            0%,
            60%,
            100% {
                opacity: 0.25;
                transform: translateY(0);
            }

            30% {
                opacity: 1;
                transform: translateY(-3px);
            }

        }


        /* =========================================================
           THINKING AVATAR
        ========================================================= */

        .thinking-avatar {
            animation: thinkingAvatar 1.8s ease-in-out infinite;
        }

        @keyframes thinkingAvatar {

            0%,
            100% {
                transform: translateY(0) scale(1);
                box-shadow:
                    0 0 0 rgba(59, 130, 246, 0.0);
            }

            50% {
                transform: translateY(-2px) scale(1.04);
                box-shadow:
                    0 0 18px rgba(59, 130, 246, 0.35);
            }

        }


        /* =========================================================
           CQS INTRO
        ========================================================= */

        #cqs-intro {
            position: fixed;
            inset: 0;

            z-index: 9999;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at center,
                    rgba(30, 64, 175, 0.18),
                    transparent 40%
                ),
                #020617;

            transition:
                opacity 0.7s ease,
                visibility 0.7s ease;
        }

        #cqs-intro.intro-hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .intro-inner {
            width: 100%;
            padding: 32px;

            text-align: center;
        }

        .intro-avatar {
            width: 82px;
            height: 82px;

            margin: 0 auto 22px;

            border-radius: 26px;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    145deg,
                    #2563eb,
                    #1e40af
                );

            box-shadow:
                0 0 50px rgba(37, 99, 235, 0.28);

            animation: introAvatar 2s ease-in-out infinite;
        }

        @keyframes introAvatar {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-5px);
            }

        }

        .intro-face {
            font-size: 36px;
            user-select: none;
        }

        .intro-title {
            min-height: 38px;

            color: #f8fafc;

            font-size: 25px;
            font-weight: 700;

            letter-spacing: 0.18em;
        }

        .intro-subtitle {
            margin-top: 9px;

            color: #64748b;

            font-size: 10px;

            letter-spacing: 0.25em;

            text-transform: uppercase;
        }

        .intro-cursor {
            display: inline-block;

            width: 2px;
            height: 23px;

            margin-left: 4px;

            vertical-align: -3px;

            background: #60a5fa;

            animation: cursorBlink 0.8s infinite;
        }

        @keyframes cursorBlink {

            0%,
            50% {
                opacity: 1;
            }

            51%,
            100% {
                opacity: 0;
            }

        }


        /* =========================================================
           MODALS
        ========================================================= */

        #history-drawer,
        #config-modal,
        #confirm-modal {
            transition: opacity 0.2s ease;
        }

        #history-drawer.hidden,
        #config-modal.hidden,
        #confirm-modal.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #history-panel {
            transition:
                transform 0.25s cubic-bezier(
                    0.16,
                    1,
                    0.3,
                    1
                );
        }

        #history-drawer.hidden #history-panel {
            transform: translateX(-100%);
        }

        .modal-content {
            transform:
                translateY(0)
                scale(1);

            transition:
                transform 0.2s ease,
                opacity 0.2s ease;
        }

        .modal-overlay.hidden .modal-content {
            transform:
                translateY(8px)
                scale(0.98);

            opacity: 0;
        }


        /* =========================================================
           VOICE STATE
        ========================================================= */

        .voice-recording {
            background: rgb(127 29 29) !important;
            color: rgb(248 113 113) !important;
            animation: voicePulse 1s infinite;
        }

        @keyframes voicePulse {

            0%,
            100% {
                box-shadow:
                    0 0 0 rgba(239, 68, 68, 0);
            }

            50% {
                box-shadow:
                    0 0 18px rgba(239, 68, 68, 0.35);
            }

        }


        /* =========================================================
           FILE CHIP
        ========================================================= */

        .file-chip {
            animation: messageEnter 0.2s ease-out;
        }

    </style>
</head>


<body class="bg-slate-950 text-slate-100">


<!-- =============================================================
     CQS AI INTRO
============================================================= -->

<div id="cqs-intro">

    <div class="intro-inner">

        <div class="intro-avatar">
            <div class="intro-face">🧐</div>
        </div>

        <div
            id="intro-title"
            class="intro-title"
        ></div>

        <div class="intro-subtitle">
            intelligent console
        </div>

    </div>

</div>


<!-- =============================================================
     APPLICATION
============================================================= -->

<div
    id="app"
    class="w-full flex flex-col bg-slate-950"
    style="
        height:100vh;
        height:100dvh;
        min-height:100svh;
    "
>


    <!-- =========================================================
         HEADER
    ========================================================= -->

    <header
        class="
            shrink-0
            px-4
            py-3
            flex
            items-center
            justify-between
            border-b
            border-slate-800
            bg-slate-900/90
            backdrop-blur-md
            z-20
            safe-top
        "
    >

        <div class="flex items-center space-x-2 min-w-0">

            <button
                id="history-btn"
                type="button"
                aria-label="打开菜单"
                class="
                    w-9
                    h-9
                    shrink-0
                    flex
                    items-center
                    justify-center
                    rounded-xl
                    bg-slate-800
                    text-slate-300
                    active:scale-95
                    transition
                "
            >
                <i class="fa-solid fa-bars"></i>
            </button>


            <h1
                id="current-title"
                class="
                    text-base
                    font-semibold
                    tracking-wide
                    truncate
                "
            >
                AI 对话中心
            </h1>

        </div>


        <div class="flex items-center space-x-2 shrink-0">

            <!-- SOUND -->

            <button
                id="sound-toggle-btn"
                type="button"
                aria-label="音效开关"
                class="
                    w-9
                    h-9
                    flex
                    items-center
                    justify-center
                    rounded-xl
                    bg-slate-800
                    text-indigo-400
                    active:scale-95
                    transition
                "
            >
                <i
                    id="sound-icon"
                    class="fa-solid fa-volume-high text-sm"
                ></i>
            </button>


            <!-- TOKEN -->

            <div
                class="
                    text-[11px]
                    bg-indigo-500/10
                    text-indigo-400
                    border
                    border-indigo-500/20
                    px-2
                    py-1
                    rounded-full
                    font-mono
                    whitespace-nowrap
                "
            >

                <span id="token-count">0</span>

                tokens

            </div>


            <!-- EXPORT -->

            <button
                id="export-btn"
                type="button"
                aria-label="导出"
                class="
                    w-9
                    h-9
                    flex
                    items-center
                    justify-center
                    rounded-xl
                    bg-indigo-600
                    text-white
                    active:scale-95
                    transition
                "
            >
                <i class="fa-solid fa-download text-sm"></i>
            </button>

        </div>

    </header>


    <!-- =========================================================
         CHAT
    ========================================================= -->

    <main
        id="chat-container"
        class="
            flex-1
            relative
            overflow-y-auto
            overscroll-contain
            p-4
            space-y-4
        "
        style="padding-bottom:110px;"
    ></main>


    <!-- =========================================================
         INPUT NAV
    ========================================================= -->

    <nav
        class="
            shrink-0
            p-3
            bg-slate-900/95
            border-t
            border-slate-800
            backdrop-blur-lg
            z-20
            flex
            items-center
            space-x-2
            safe-bottom
        "
    >

        <!-- FILE -->

        <button
            id="upload-btn"
            type="button"
            aria-label="上传文件"
            class="
                w-12
                h-12
                bg-slate-800
                hover:bg-slate-700
                text-slate-300
                rounded-xl
                flex
                items-center
                justify-center
                shrink-0
                active:scale-95
                transition
            "
        >
            <i class="fa-solid fa-paperclip text-sm"></i>
        </button>


        <!-- VOICE -->

        <button
            id="voice-btn"
            type="button"
            aria-label="语音聊天"
            class="
                w-12
                h-12
                bg-slate-800
                hover:bg-slate-700
                text-slate-300
                rounded-xl
                flex
                items-center
                justify-center
                shrink-0
                active:scale-95
                transition
            "
        >
            <i
                id="voice-icon"
                class="fa-solid fa-microphone text-sm"
            ></i>
        </button>


        <!-- TEXT -->

        <input
            type="text"
            id="user-input"
            autocomplete="off"
            autocapitalize="sentences"
            enterkeyhint="send"
            placeholder="输入消息..."
            class="
                flex-1
                min-w-0
                bg-slate-800
                text-slate-100
                placeholder-slate-500
                text-base
                rounded-xl
                px-4
                py-3
                border
                border-slate-700/60
                focus:border-indigo-500
                focus:ring-2
                focus:ring-indigo-500/30
                transition
            "
        >


        <!-- SEND -->

        <button
            id="send-btn"
            type="button"
            aria-label="发送"
            class="
                w-12
                h-12
                bg-indigo-600
                hover:bg-indigo-500
                text-white
                rounded-xl
                flex
                items-center
                justify-center
                shrink-0
                active:scale-95
                transition
                shadow-lg
                shadow-indigo-600/30
            "
        >
            <i class="fa-solid fa-paper-plane"></i>
        </button>

    </nav>


    <!-- =========================================================
         FILE INPUT
    ========================================================= -->

    <input
        id="file-input"
        type="file"
        hidden
        multiple
    >


    <!-- =========================================================
         HISTORY DRAWER
    ========================================================= -->

    <div
        id="history-drawer"
        class="
            fixed
            inset-0
            bg-black/60
            backdrop-blur-sm
            z-50
            hidden
        "
    >

        <div
            id="history-panel"
            class="
                absolute
                left-0
                top-0
                bottom-0
                w-[82%]
                max-w-sm
                bg-slate-900
                border-r
                border-slate-800
                p-4
                flex
                flex-col
                safe-top
                safe-bottom
            "
        >

            <div
                class="
                    flex
                    items-center
                    justify-between
                    pb-3
                    border-b
                    border-slate-800
                    mb-3
                "
            >

                <h2
                    class="
                        text-sm
                        font-semibold
                        text-slate-200
                        flex
                        items-center
                        space-x-2
                    "
                >

                    <i
                        class="fa-solid fa-compass text-indigo-400"
                    ></i>

                    <span>控制台菜单</span>

                </h2>


                <button
                    id="close-drawer"
                    type="button"
                    aria-label="关闭"
                    class="
                        text-slate-400
                        hover:text-white
                        w-8
                        h-8
                        flex
                        items-center
                        justify-center
                        rounded-lg
                        hover:bg-slate-800
                    "
                >
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>

            </div>


            <!-- NEW CHAT -->

            <button
                id="new-chat-btn"
                type="button"
                class="
                    w-full
                    mb-3
                    py-2.5
                    px-4
                    bg-indigo-600
                    hover:bg-indigo-500
                    text-white
                    rounded-xl
                    text-sm
                    font-medium
                    flex
                    items-center
                    space-x-2
                    shadow-lg
                    shadow-indigo-600/20
                    active:scale-98
                    transition
                "
            >

                <i class="fa-solid fa-plus"></i>

                <span>开启新话题</span>

            </button>


            <!-- SYSTEM -->

            <div
                class="
                    space-y-1.5
                    mb-3
                    pb-3
                    border-b
                    border-slate-800
                "
            >

                <div
                    class="
                        text-[11px]
                        font-semibold
                        text-slate-500
                        uppercase
                        tracking-wider
                        px-1
                        mb-1
                    "
                >
                    系统功能
                </div>


                <button
                    id="deploy-skill-btn"
                    type="button"
                    class="
                        w-full
                        py-2
                        px-3
                        bg-slate-800/50
                        hover:bg-slate-800
                        text-slate-300
                        rounded-xl
                        text-xs
                        flex
                        items-center
                        justify-between
                        transition
                    "
                >

                    <span
                        class="flex items-center space-x-2"
                    >

                        <i
                            class="
                                fa-solid
                                fa-wand-magic-sparkles
                                text-indigo-400
                            "
                        ></i>

                        <span>部署 Skill</span>

                    </span>


                    <i
                        class="
                            fa-solid
                            fa-plus
                            text-[10px]
                            text-slate-500
                        "
                    ></i>

                </button>


                <button
                    id="deploy-agent-btn"
                    type="button"
                    class="
                        w-full
                        py-2
                        px-3
                        bg-slate-800/50
                        hover:bg-slate-800
                        text-slate-300
                        rounded-xl
                        text-xs
                        flex
                        items-center
                        justify-between
                        transition
                    "
                >

                    <span
                        class="flex items-center space-x-2"
                    >

                        <i
                            class="
                                fa-solid
                                fa-brain
                                text-emerald-400
                            "
                        ></i>

                        <span>部署 Agent</span>

                    </span>


                    <i
                        class="
                            fa-solid
                            fa-plus
                            text-[10px]
                            text-slate-500
                        "
                    ></i>

                </button>

            </div>


            <!-- DEPLOYED -->

            <div
                id="deployed-section"
                class="
                    space-y-2
                    mb-3
                    pb-3
                    border-b
                    border-slate-800
                    hidden
                "
            >

                <div
                    class="
                        text-[11px]
                        font-semibold
                        text-slate-500
                        uppercase
                        tracking-wider
                        px-1
                    "
                >
                    我的技能与智能体
                </div>


                <div
                    id="deployed-list"
                    class="space-y-1"
                ></div>

            </div>


            <!-- HISTORY -->

            <div
                class="
                    text-[11px]
                    font-semibold
                    text-slate-500
                    uppercase
                    tracking-wider
                    px-1
                    mb-1
                "
            >
                历史会话
            </div>


            <div
                id="history-list"
                class="
                    flex-1
                    overflow-y-auto
                    space-y-1.5
                    pb-2
                "
            ></div>

        </div>

    </div>


    <!-- =========================================================
         CONFIG MODAL
    ========================================================= -->

    <div
        id="config-modal"
        class="
            modal-overlay
            fixed
            inset-0
            bg-black/70
            backdrop-blur-sm
            z-[60]
            hidden
            flex
            items-center
            justify-center
            p-4
        "
    >

        <div
            class="
                modal-content
                bg-slate-900
                border
                border-slate-800
                w-full
                max-w-sm
                rounded-2xl
                p-5
                shadow-2xl
                space-y-4
            "
        >

            <div
                class="
                    flex
                    items-center
                    justify-between
                    pb-2
                    border-b
                    border-slate-800
                "
            >

                <h3
                    id="modal-title"
                    class="
                        text-sm
                        font-semibold
                        text-slate-200
                    "
                >
                    配置
                </h3>


                <button
                    id="close-modal"
                    type="button"
                    class="
                        text-slate-400
                        hover:text-white
                        w-7
                        h-7
                        flex
                        items-center
                        justify-center
                        rounded-lg
                        hover:bg-slate-800
                    "
                >
                    <i class="fa-solid fa-xmark"></i>
                </button>

            </div>


            <div class="space-y-3">

                <div>

                    <label
                        class="
                            block
                            text-xs
                            font-medium
                            text-slate-400
                            mb-1
                        "
                    >
                        名称
                    </label>


                    <input
                        type="text"
                        id="modal-name-input"
                        maxlength="80"
                        class="
                            w-full
                            bg-slate-800
                            text-slate-100
                            text-sm
                            rounded-xl
                            px-3
                            py-2
                            border
                            border-slate-700
                            focus:border-indigo-500
                            focus:outline-none
                        "
                        placeholder="例如：专业翻译"
                    >

                </div>


                <div>

                    <label
                        class="
                            block
                            text-xs
                            font-medium
                            text-slate-400
                            mb-1
                        "
                    >
                        设定 / 系统提示词
                    </label>


                    <textarea
                        id="modal-desc-input"
                        rows="5"
                        maxlength="20000"
                        class="
                            w-full
                            bg-slate-800
                            text-slate-100
                            text-sm
                            rounded-xl
                            px-3
                            py-2
                            border
                            border-slate-700
                            focus:border-indigo-500
                            focus:outline-none
                            resize-none
                        "
                        placeholder="输入具体的行为设定或规则..."
                    ></textarea>

                </div>

            </div>


            <div class="flex space-x-2 pt-2">

                <button
                    id="modal-cancel-btn"
                    type="button"
                    class="
                        flex-1
                        py-2
                        bg-slate-800
                        hover:bg-slate-700
                        text-slate-300
                        rounded-xl
                        text-xs
                        font-medium
                        transition
                    "
                >
                    取消
                </button>


                <button
                    id="modal-save-btn"
                    type="button"
                    class="
                        flex-1
                        py-2
                        bg-indigo-600
                        hover:bg-indigo-500
                        text-white
                        rounded-xl
                        text-xs
                        font-medium
                        transition
                        shadow-lg
                        shadow-indigo-600/30
                    "
                >
                    确认部署
                </button>

            </div>

        </div>

    </div>


    <!-- =========================================================
         CONFIRM
    ========================================================= -->

    <div
        id="confirm-modal"
        class="
            modal-overlay
            fixed
            inset-0
            bg-black/70
            backdrop-blur-sm
            z-[70]
            hidden
            flex
            items-center
            justify-center
            p-4
        "
    >

        <div
            class="
                modal-content
                bg-slate-900
                border
                border-slate-800
                w-full
                max-w-sm
                rounded-2xl
                p-5
                shadow-2xl
            "
        >

            <div class="flex items-start space-x-3">

                <div
                    class="
                        w-9
                        h-9
                        rounded-xl
                        bg-red-500/10
                        text-red-400
                        flex
                        items-center
                        justify-center
                        shrink-0
                    "
                >
                    <i class="fa-solid fa-trash"></i>
                </div>


                <div>

                    <h3
                        class="
                            text-sm
                            font-semibold
                            text-slate-100
                        "
                    >
                        删除会话？
                    </h3>


                    <p
                        class="
                            text-xs
                            text-slate-500
                            mt-1
                            leading-relaxed
                        "
                    >
                        删除后该会话中的聊天记录将从本地设备移除。
                    </p>

                </div>

            </div>


            <div class="flex space-x-2 mt-5">

                <button
                    id="confirm-cancel"
                    type="button"
                    class="
                        flex-1
                        py-2
                        bg-slate-800
                        hover:bg-slate-700
                        text-slate-300
                        rounded-xl
                        text-xs
                    "
                >
                    取消
                </button>


                <button
                    id="confirm-delete"
                    type="button"
                    class="
                        flex-1
                        py-2
                        bg-red-600
                        hover:bg-red-500
                        text-white
                        rounded-xl

    "cqs_ai_console_state_v4";


/* =============================================================
   AUDIO
============================================================= */

let audioCtx = null;

let lastTypeSound = 0;


function initAudio() {

    if (!audioCtx) {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        if (AudioContext) {

            audioCtx =
                new AudioContext();

        }

    }

    if (
        audioCtx &&
        audioCtx.state === "suspended"
    ) {

        audioCtx.resume();

    }

}


function playSound(type) {

    if (!soundEnabled) return;

    try {

        initAudio();

        if (!audioCtx) return;

        const osc =
            audioCtx.createOscillator();

        const gain =
            audioCtx.createGain();

        osc.connect(gain);

        gain.connect(
            audioCtx.destination
        );

        const now =
            audioCtx.currentTime;


        if (type === "click") {

            osc.type = "sine";

            osc.frequency.setValueAtTime(
                720,
                now
            );

            gain.gain.setValueAtTime(
                0.025,
                now
            );

            gain.gain.exponentialRampToValueAtTime(
                0.001,
                now + 0.035
            );

            osc.start(now);

            osc.stop(now + 0.035);

        }


        else if (type === "type") {

            osc.type = "sine";

            osc.frequency.setValueAtTime(
                800,
                now
            );

            gain.gain.setValueAtTime(
                0.018,
                now
            );

            gain.gain.exponentialRampToValueAtTime(
                0.001,
                now + 0.035
            );

            osc.start(now);

            osc.stop(now + 0.035);

        }


        else if (type === "output") {

            osc.type = "triangle";

            osc.frequency.setValueAtTime(
                440,
                now
            );

            osc.frequency.exponentialRampToValueAtTime(
                880,
                now + 0.1
            );

            gain.gain.setValueAtTime(
                0.045,
                now
            );

            gain.gain.exponentialRampToValueAtTime(
                0.001,
                now + 0.13
            );

            osc.start(now);

            osc.stop(now + 0.13);

        }


        else if (type === "think") {

            osc.type = "sine";

            osc.frequency.setValueAtTime(
                300,
                now
            );

            osc.frequency.linearRampToValueAtTime(
                360,
                now + 0.2
            );

            gain.gain.setValueAtTime(
                0.035,
                now
            );

            gain.gain.exponentialRampToValueAtTime(
                0.001,
                now + 0.25
            );

            osc.start(now);

            osc.stop(now + 0.25);

        }

    } catch {

        /* Audio failure must never break chat */

    }

}


/* =============================================================
   INTRO
============================================================= */

function playIntro() {

    const text =
        "CQS AI WELCOME";

    introTitle.innerHTML = "";

    let index = 0;

    const cursor =
        document.createElement("span");

    cursor.className =
        "intro-cursor";

    introTitle.appendChild(cursor);


    function next() {

        if (index >= text.length) {

            setTimeout(() => {

                cqsIntro.classList.add(
                    "intro-hidden"
                );

            }, 650);

            return;

        }


        const character =
            text[index];

        const node =
            document.createTextNode(
                character
            );

        introTitle.insertBefore(
            node,
            cursor
        );

        index++;

        if (character !== " ") {

            playSound("type");

        }

        setTimeout(
            next,
            character === " " ? 55 : 75
        );

    }

    next();

}


/* =============================================================
   ID
============================================================= */

function createId(prefix = "id") {

    return (
        prefix +
        "_" +
        Date.now().toString(36) +
        "_" +
        Math.random()
            .toString(36)
            .slice(2, 9)
    );

}


/* =============================================================
   CONVERSATION
============================================================= */

function createConversation() {

    return {

        id:
            createId("chat"),

        title:
            "新对话",

        createdAt:
            Date.now(),

        updatedAt:
            Date.now(),

        messages: [],

        systemPrompt:
            "",

        systemName:
            "",

        systemType:
            ""

    };

}


/* =============================================================
   STORAGE
============================================================= */

function saveState() {

    try {

        localStorage.setItem(

            STORAGE_KEY,

            JSON.stringify({

                conversations,

                activeConversationId,

                deployedItems,

                totalTokens,

                soundEnabled

            })

        );

    } catch (error) {

        console.error(
            "Storage save error:",
            error
        );

    }

}


function loadState() {

    try {

        const raw =
            localStorage.getItem(
                STORAGE_KEY
            );


        if (!raw) {

            const first =
                createConversation();

            conversations = [first];

            activeConversationId =
                first.id;

            saveState();

            updateSoundUI();

            return;

        }


        const state =
            JSON.parse(raw);


        if (
            state &&
            Array.isArray(
                state.conversations
            )
        ) {

            conversations =
                state.conversations.filter(
                    item =>
                        item &&
                        typeof item.id === "string" &&
                        Array.isArray(item.messages)
                );

        }


        if (
            !Array.isArray(conversations) ||
            conversations.length === 0
        ) {

            const first =
                createConversation();

            conversations = [first];

        }


        if (
            typeof state.activeConversationId ===
            "string" &&
            conversations.some(
                item =>
                    item.id ===
                    state.activeConversationId
            )
        ) {

            activeConversationId =
                state.activeConversationId;

        } else {

            activeConversationId =
                conversations[0].id;

        }


        if (
            Array.isArray(
                state.deployedItems
            )
        ) {

            deployedItems =
                state.deployedItems.filter(
                    item =>
                        item &&
                        typeof item.name === "string" &&
                        typeof item.prompt === "string" &&
                        (
                            item.type === "skill" ||
                            item.type === "agent"
                        )
                );

        }


        if (
            Number.isFinite(
                Number(state.totalTokens)
            )
        ) {

            totalTokens =
                Math.max(
                    0,
                    Number(
                        state.totalTokens
                    )
                );

        }


        if (
            typeof state.soundEnabled ===
            "boolean"
        ) {

            soundEnabled =
                state.soundEnabled;

        }


    } catch {

        const first =
            createConversation();

        conversations = [first];

        activeConversationId =
            first.id;

        deployedItems = [];

        totalTokens = 0;

        soundEnabled = true;

    }


    updateSoundUI();

    saveState();

}


/* =============================================================
   SOUND UI
============================================================= */

function updateSoundUI() {

    if (soundEnabled) {

        soundIcon.className =
            "fa-solid fa-volume-high text-sm text-indigo-400";

        soundToggleBtn.classList.remove(
            "opacity-50"
        );

    } else {

        soundIcon.className =
            "fa-solid fa-volume-xmark text-sm text-slate-500";

        soundToggleBtn.classList.add(
            "opacity-50"
        );

    }

}


soundToggleBtn.addEventListener(
    "click",
    () => {

        initAudio();

        soundEnabled =
            !soundEnabled;

        updateSoundUI();

        saveState();

        if (soundEnabled) {

            playSound("output");

        }

    }
);


/* =============================================================
   ACTIVE CONVERSATION
============================================================= */

function getActiveConversation() {

    return conversations.find(
        item =>
            item.id ===
            activeConversationId
    ) || null;

}


function ensureActiveConversation() {

    let conversation =
        getActiveConversation();


    if (conversation) {

        return conversation;

    }


    conversation =
        createConversation();

    conversations.unshift(
        conversation
    );

    activeConversationId =
        conversation.id;

    saveState();

    return conversation;

}


/* =============================================================
   TOKEN
============================================================= */

function updateTokenDisplay() {

    tokenCountEl.textContent =
        Number(
            totalTokens || 0
        ).toLocaleString();

}


/* =============================================================
   SCROLL
============================================================= */

function scrollToBottom() {

    requestAnimationFrame(() => {

        chatContainer.scrollTop =
            chatContainer.scrollHeight;

    });

}


/* =============================================================
   WELCOME
============================================================= */

function showWelcome() {

}


/* =============================================================
   MESSAGE UI
============================================================= */

function appendUI(
    role,

    save = true
) {

        role === "user";


    const wrapper =
        document.createElement("div");

    wrapper.className =
        `flex items-start space-x-3 message-enter ${

                ? "flex-row-reverse space-x-reverse"
                : ""
        }`;

            isUser
                ? "bg-emerald-600"
                : "bg-blue-600 shadow-md shadow-blue-500/20"
        } flex items-center justify-center shrink-0`;


    if (isUser) {

        const icon =
            document.createElement("i");

        icon.className =
            "fa-solid fa-user text-xs text-white";

        avatar.appendChild(icon);

    } else {

        const span =
            document.createElement("span");

        span.className =
            "text-xs select-none";

        span.textContent =
            "🧐";

        avatar.appendChild(span);

    }


    const bubble =
        document.createElement("div");

    bubble.className =
        `${isUser
            ? "bg-indigo-600 text-white"

    wrapper.appendChild(avatar);

    wrapper.appendChild(bubble);

    chatContainer.appendChild(wrapper);


    if (save) {

        const conversation =
            ensureActiveConversation();


        conversation.messages.push({

            role,

            content:
                String(text)

        });


        conversation.updatedAt =
            Date.now();


        updateConversationTitle(
            conversation
        );


        saveState();

        renderHistory();

    }


    scrollToBottom();

    return wrapper;

}


/* =============================================================
   THINKING
============================================================= */

function createLoading() {

    playSound("think");


    const wrapper =
        document.createElement("div");

    wrapper.id =
        "loading-message";

    wrapper.className =
        "flex items-start space-x-3 message-enter";


    const avatar =
        document.createElement("div");

        "thinking-avatar w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center shrink-0";


    const span =
        document.createElement("span");

    span.className =
        "text-xs select-none";

    span.textContent =
        "🧐";


    avatar.appendChild(span);


    const bubble =
        document.createElement("div");

    bubble.className =
        "bg-slate-900 border border-slate-800 rounded-2xl p-3.5 text-sm text-slate-400 flex items-center space-x-1.5";


    const textSpan =
        document.createElement("span");

    textSpan.className =
        "text-xs text-blue-400 font-medium";

    textSpan.textContent =
        "深度思考中";

    bubble.appendChild(textSpan);


    for (
        let i = 0;
        i < 3;
        i++
    ) {

        const dot =
            document.createElement("span");

        dot.className =
            "typing-dot text-blue-400";

        dot.textContent =
            "●";

        bubble.appendChild(dot);

    }


    wrapper.appendChild(avatar);

    wrapper.appendChild(bubble);

    chatContainer.appendChild(wrapper);

}


function removeLoading() {

    const loading =
        document.getElementById(
            "loading-message"
        );

    if (loading) {

        loading.remove();

    }

}


/* =============================================================
   CONVERSATION TITLE
============================================================= */

function updateConversationTitle(
    conversation
) {

    if (!conversation) return;


    const firstUserMessage =
        conversation.messages.find(
            message =>
                message.role ===
                "user"
        );


    if (
        firstUserMessage &&
        firstUserMessage.content
    ) {

        const title =
            firstUserMessage.content
                .replace(/\s+/g, " ")
                .trim();


        conversation.title =
            title.length > 28
                ? title.slice(0, 28) + "…"
                : title;

    }


    conversation.updatedAt =
        Date.now();

}


/* =============================================================
   RENDER CURRENT
============================================================= */

function renderCurrentConversation() {

    chatContainer.innerHTML = "";


    const conversation =
        ensureActiveConversation();


    currentTitleEl.textContent =
        conversation.title ||
        "新对话";


    currentSystemPrompt =
        conversation.systemPrompt ||
        "";


    if (conversation.systemName) {

        currentTitleEl.textContent =
            `${
                conversation.systemType === "agent"
                    ? "Agent"
                    : "Skill"
            }: ${conversation.systemName}`;

    }


    for (
        const message of
        conversation.messages
    ) {

        if (
            !message ||
            (
                message.role !== "user" &&
                message.role !== "assistant"
            )
        ) {

            continue;

        }


        appendUI(
            message.role,
            message.content,
            false
        );

    }


    showWelcome();

    scrollToBottom();

}


/* =============================================================
   HISTORY
============================================================= */

function renderHistory() {

    historyList.innerHTML = "";


    const sorted =
        [...conversations].sort(
            (a, b) =>
                Number(b.updatedAt || 0) -
                Number(a.updatedAt || 0)
        );


    if (!sorted.length) {

        const empty =
            document.createElement("div");

        empty.className =
            "text-xs text-slate-500 text-center py-4";

        empty.textContent =
            "暂无历史会话";

        historyList.appendChild(empty);

        return;

    }


    sorted.forEach(
        conversation => {

            const row =
                document.createElement("div");


            row.className =
                `group p-2.5 rounded-xl cursor-pointer flex items-center justify-between gap-2 transition ${
                    conversation.id ===
                    activeConversationId
                        ? "bg-indigo-600/20 border border-indigo-500/20"
                        : "bg-slate-800/40 hover:bg-slate-800"
                }`;


            const left =
                document.createElement("div");

            left.className =
                "min-w-0 flex-1";


            const title =
                document.createElement("div");

            title.className =
                "text-xs text-slate-200 truncate";

            title.textContent =
                conversation.title ||
                "新对话";


            const count =
                document.createElement("div");

            count.className =
                "text-[10px] text-slate-500 mt-0.5";

            count.textContent =
                `${conversation.messages.length} 条消息`;


            left.appendChild(title);

            left.appendChild(count);


            const deleteBtn =
                document.createElement("button");

            deleteBtn.type =
                "button";

            deleteBtn.className =
                "w-7 h-7 shrink-0 rounded-lg text-slate-500 hover:text-red-400 hover:bg-red-500/10 transition";

            deleteBtn.setAttribute(
                "aria-label",
                "删除会话"
            );


            const deleteIcon =
                document.createElement("i");

            deleteIcon.className =
                "fa-solid fa-trash text-[10px]";


            deleteBtn.appendChild(
                deleteIcon
            );


            row.appendChild(left);

            row.appendChild(deleteBtn);


            left.addEventListener(
                "click",
                () =>
                    switchConversation(
                        conversation.id
                    )
            );


            deleteBtn.addEventListener(
                "click",
                event => {

                    event.stopPropagation();

                    askDeleteConversation(
                        conversation.id
                    );

                }
            );


            historyList.appendChild(row);

        }
    );

}


/* =============================================================
   SWITCH
============================================================= */

function switchConversation(id) {

    playSound("click");


    const conversation =
        conversations.find(
            item =>
                item.id === id
        );


    if (!conversation) return;


    activeConversationId =
        id;


    currentSystemPrompt =
        conversation.systemPrompt ||
        "";


    saveState();

    renderCurrentConversation();

    renderHistory();

    closeHistory();

}


/* =============================================================
   NEW CHAT
============================================================= */

function startNewChat() {

    playSound("click");


    const conversation =
        createConversation();


    conversations.unshift(
        conversation
    );


    activeConversationId =
        conversation.id;


    currentSystemPrompt =
        "";


    saveState();

    renderCurrentConversation();

    renderHistory();

    closeHistory();

    userInput.focus();

}


newChatBtn.addEventListener(
    "click",
    startNewChat
);


/* =============================================================
   DELETE
============================================================= */

function askDeleteConversation(id) {

    playSound("click");

    pendingDeleteId =
        id;

    confirmModal.classList.remove(
        "hidden"
    );

}


function closeConfirmModal() {

    confirmModal.classList.add(
        "hidden"
    );

    pendingDeleteId =
        null;

}


confirmCancel.addEventListener(
    "click",
    closeConfirmModal
);


confirmDelete.addEventListener(
    "click",
    () => {

        if (!pendingDeleteId) {
            return;
        }


        conversations =
            conversations.filter(
                item =>
                    item.id !==
                    pendingDeleteId
            );


        if (!conversations.length) {

            const conversation =
                createConversation();

            conversations = [
                conversation
            ];

            activeConversationId =
                conversation.id;

        }

        else if (
            activeConversationId ===
            pendingDeleteId
        ) {

            activeConversationId =
                conversations[0].id;

        }


        saveState();

        renderCurrentConversation();

        renderHistory();

        closeConfirmModal();

    }
);


/* =============================================================
   SEND
============================================================= */

async function handleSend() {

    if (isSending) return;


    const text =
        userInput.value.trim();


    if (!text) return;


    if (text.length > 10000) {

        appendUI(
            "assistant",
            "⚠️ 单条消息不能超过 10000 个字符。",
            true
        );

        return;

    }


    initAudio();

    playSound("click");


    const conversation =
        ensureActiveConversation();


    isSending = true;

    sendBtn.disabled = true;

    userInput.disabled = true;

    userInput.value = "";


    appendUI(
        "user",
        text,
        true
    );


    createLoading();


    try {

        const finalMessages =
            conversation.messages.map(
                message => ({

                    role:
                        message.role,

                    content:
                        message.content

                })
            );


        const response =
            await fetch(
                "/api/chat",
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            messages:
                                finalMessages,

                            systemPrompt:
                                currentSystemPrompt ||
                                ""

                        })

                }
            );


        let data;


        try {

            data =
                await response.json();

        } catch {

            throw new Error(
                `服务器返回了无法解析的数据 (${response.status})`
            );

        }


        removeLoading();


        if (!response.ok) {

            let errorMessage =
                data?.error ||
                "服务器请求失败";


            if (data?.detail) {

                errorMessage +=
                    `\n${data.detail}`;

            }


            appendUI(
                "assistant",
                `⚠️ 错误：${errorMessage}`,
                true
            );


            return;

        }


        const reply =
            data?.reply ||
            data?.choices?.[0]?.message?.content;


        if (
            typeof reply !== "string" ||
            !reply.trim()
        ) {

            appendUI(
                "assistant",
                "⚠️ 错误：未获取到有效的 AI 回复。",
                true
            );

            return;

        }


        appendUI(
            "assistant",
            reply,
            true
        );


        playSound("output");


        const usage =
            data?.usage;


        const realTokens =
            Number(
                usage?.total_tokens
            );


        if (
            Number.isFinite(realTokens) &&
            realTokens > 0
        ) {

            totalTokens +=
                realTokens;

            updateTokenDisplay();

            saveState();

        }


    } catch (error) {

        removeLoading();


        let message =
            error?.message ||
            "网络连接异常";


        if (
            message ===
            "Failed to fetch"
        ) {

            message =
                "网络繁忙或连接中断，请检查网络后重试。";

        }


        appendUI(
            "assistant",
            `⚠️ ${message}`,
            true
        );


    } finally {

        isSending =
            false;

        sendBtn.disabled =
            false;

        userInput.disabled =
            false;

        userInput.focus();

    }

}


sendBtn.addEventListener(
    "click",
    handleSend
);


userInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            handleSend();

        }

    }
);


/*
 * 输入音效做节流。
 * 不会每一次快速输入都制造大量声音。
 */

userInput.addEventListener(
    "input",
    () => {

        const now =
            Date.now();


        if (
            now - lastTypeSound <
            70
        ) {

            return;

        }


        lastTypeSound =
            now;


        playSound("type");

    }
);


/* =============================================================
   SKILL / AGENT
============================================================= */

function renderDeployedItems() {

    deployedList.innerHTML = "";


    if (!deployedItems.length) {

        deployedSection.classList.add(
            "hidden"
        );

        return;

    }


    deployedSection.classList.remove(
        "hidden"
    );


    deployedItems.forEach(
        (item, index) => {

            const row =
                document.createElement("div");


            row.className =
                "p-2 bg-slate-800/40 rounded-xl text-xs flex items-center justify-between group hover:bg-slate-800 transition";


            const left =
                document.createElement("button");

            left.type =
                "button";

            left.className =
                "flex items-center space-x-2 truncate min-w-0 text-left";


            const icon =
                document.createElement("i");

            icon.className =
                item.type === "skill"
                    ? "fa-solid fa-wand-magic-sparkles text-indigo-400"
                    : "fa-solid fa-brain text-emerald-400";


            const name =
                document.createElement("span");

            name.className =
                "text-slate-300 truncate";

            name.textContent =
                item.name;


            left.appendChild(icon);

            left.appendChild(name);


            left.addEventListener(
                "click",
                () =>
                    activateItem(item)
            );


            const deleteBtn =
                document.createElement("button");

            deleteBtn.type =
                "button";

            deleteBtn.className =
                "w-7 h-7 text-slate-500 hover:text-red-400 rounded-lg transition";

            deleteBtn.setAttribute(
                "aria-label",
                "删除"
            );


            const deleteIcon =
                document.createElement("i");

            deleteIcon.className =
                "fa-solid fa-trash text-[10px]";


            deleteBtn.appendChild(
                deleteIcon
            );


            deleteBtn.addEventListener(
                "click",
                event => {

                    event.stopPropagation();

                    deployedItems.splice(
                        index,
                        1
                    );

                    saveState();

                    renderDeployedItems();

                }
            );


            row.appendChild(left);

            row.appendChild(deleteBtn);

            deployedList.appendChild(row);

        }
    );

}


function activateItem(item) {

    playSound("click");


    const conversation =
        ensureActiveConversation();


    conversation.systemPrompt =
        item.prompt;

    conversation.systemName =
        item.name;

    conversation.systemType =
        item.type;


    currentSystemPrompt =
        item.prompt;


    currentTitleEl.textContent =
        `${
            item.type === "agent"
                ? "Agent"
                : "Skill"
        }: ${item.name}`;


    conversation.updatedAt =
        Date.now();


    saveState();

    renderCurrentConversation();

    closeHistory();

}


/* =============================================================
   CONFIG
============================================================= */

function openConfigModal(type) {

    playSound("click");


    currentMode =
        type;


    closeHistory();


    modalTitle.textContent =
        type === "skill"
            ? "部署新 Skill"
            : "部署新 Agent";


    modalNameInput.value =
        "";

    modalDescInput.value =
        "";


    modalNameInput.placeholder =
        type === "skill"
            ? "例如：代码审查助手"
            : "例如：全栈架构师";


    modalDescInput.placeholder =
        type === "skill"
            ? "输入该技能的具体提示词规则..."
            : "输入该智能体的人设与背景描述...";


    configModal.classList.remove(
        "hidden"
    );


    requestAnimationFrame(
        () =>
            modalNameInput.focus()
    );

}


deploySkillBtn.addEventListener(
    "click",
    () =>
        openConfigModal("skill")
);


deployAgentBtn.addEventListener(
    "click",
    () =>
        openConfigModal("agent")
);


function closeConfigModal() {

    configModal.classList.add(
        "hidden"
    );

}


closeModal.addEventListener(
    "click",
    closeConfigModal
);


modalCancelBtn.addEventListener(
    "click",
    closeConfigModal
);


modalSaveBtn.addEventListener(
    "click",
    () => {

        const name =
            modalNameInput.value.trim();


        const prompt =
            modalDescInput.value.trim();


        if (!name) {

            modalNameInput.focus();

            return;

        }


        if (!prompt) {

            modalDescInput.focus();

            return;

        }


        if (
            prompt.length >
            20000
        ) {

            alert(
                "System Prompt 不能超过 20000 个字符。"
            );

            return;

        }


        deployedItems.push({

            id:
                createId("deploy"),

            type:
                currentMode,

            name:
                name.substring(0, 80),

            prompt:
                prompt.substring(
                    0,
                    20000
                )

        });


        saveState();

        renderDeployedItems();

        closeConfigModal();

        playSound("output");

    }
);


/* =============================================================
   FILE UPLOAD
============================================================= */

uploadBtn.addEventListener(
    "click",
    () => {

        playSound("click");

        fileInput.click();

    }
);


fileInput.addEventListener(
    "change",
    () => {

        const files =
            Array.from(
                fileInput.files || []
            );


        if (!files.length) {
            return;
        }


        selectedFiles =
            files;


        files.forEach(
            file => {

                appendUI(
                    "user",
                    `📎 已选择文件：${file.name}\n类型：${
                        file.type ||
                        "未知"
                    }\n大小：${formatFileSize(
                        file.size
                    )}`,
                    true
                );

            }
        );


        /*
         * 这里故意不伪造“文件已经被 DeepSeek 读取”。
         *
         * 后续接入文件解析 API 时，
         * 可以从 selectedFiles 获取真实 File 对象。
         */

        appendUI(
            "assistant",
            "📎 文件入口已准备完成。当前版本保留文件上传接口，后续可接入 PDF、DOCX、TXT、图片或其他文件解析 API。",
            true
        );


        fileInput.value = "";

    }
);


function formatFileSize(bytes) {

    if (!Number.isFinite(bytes)) {
        return "未知";
    }


    if (bytes < 1024) {
        return `${bytes} B`;
    }


    if (bytes < 1024 * 1024) {
        return `${(
            bytes / 1024
        ).toFixed(1)} KB`;
    }


    return `${(
        bytes /
        1024 /
        1024
    ).toFixed(1)} MB`;

}


/* =============================================================
   VOICE
============================================================= */

function setupVoiceRecognition() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if (!SpeechRecognition) {

        return false;

    }


    recognition =
        new SpeechRecognition();


    recognition.lang =
        "zh-CN";


    recognition.continuous =
        false;


    recognition.interimResults =
        true;


    recognition.onstart =
        () => {

            isRecording =
                true;


            voiceBtn.classList.add(
                "voice-recording"
            );


            voiceIcon.className =
                "fa-solid fa-stop text-sm";


            userInput.placeholder =
                "正在聆听...";


            playSound("think");

        };


    recognition.onresult =
        event => {

            let finalText =
                "";


            let interimText =
                "";


            for (
                let i = event.resultIndex;
                i < event.results.length;
                i++
            ) {

                const transcript =
                    event.results[i][0]
                        .transcript;


                if (
                    event.results[i]
                        .isFinal
                ) {

                    finalText +=
                        transcript;

                } else {

                    interimText +=
                        transcript;

                }

            }


            if (finalText) {

                userInput.value =
                    finalText;

            } else if (interimText) {

                userInput.value =
                    interimText;

            }

        };


    recognition.onerror =
        event => {

            console.warn(
                "Speech recognition:",
                event.error
            );

        };


    recognition.onend =
        () => {

            isRecording =
                false;


            voiceBtn.classList.remove(
                "voice-recording"
            );


            voiceIcon.className =
                "fa-solid fa-microphone text-sm";


            userInput.placeholder =
                "输入消息...";


            if (
                userInput.value.trim()
            ) {

                userInput.focus();

            }

        };


    return true;

}


setupVoiceRecognition();


voiceBtn.addEventListener(
    "click",
    () => {

        initAudio();

        playSound("click");


        if (!recognition) {

            alert(
                "当前浏览器不支持 Web Speech API。语音聊天入口已保留，后续可以接入独立语音 API。"
            );

            return;

        }


        if (isRecording) {

            recognition.stop();

            return;

        }


        try {

            recognition.start();

        } catch (error) {

            console.warn(
                "Voice start error:",
                error
            );

        }

    }
);


/* =============================================================
   EXPORT
============================================================= */

exportBtn.addEventListener(
    "click",
    () => {

        playSound("click");


        try {

            const exportData = {

                exportedAt:
                    new Date().toISOString(),

                activeConversationId,

                totalTokens,

                conversations,

                deployedItems

            };


            const json =
                JSON.stringify(
                    exportData,
                    null,
                    2
                );


            const blob =
                new Blob(
                    [json],
                    {
                        type:
                            "application/json"
                    }
                );


            const url =
                URL.createObjectURL(
                    blob
                );


            const anchor =
                document.createElement(
                    "a"
                );


            anchor.href =
                url;


            anchor.download =
                `cqs_ai_backup_${Date.now()}.json`;


            document.body.appendChild(
                anchor
            );


            anchor.click();

            anchor.remove();


            setTimeout(
                () =>
                    URL.revokeObjectURL(
                        url
                    ),
                1000
            );


        } catch {

            alert(
                "导出失败，请稍后重试。"
            );

        }

    }
);

            event.target.closest(

        playSound("click");

    }
