<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#020617">
<title>CQS AI Global v1.0</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    scrollbar-width:none;
}
*::-webkit-scrollbar{
    width:0;
    height:0;
}
html,
body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
    overflow:hidden;
    background:#020617;
    overscroll-behavior:none;
}
body{
    min-height:100vh;
    min-height:100dvh;
    color:#f8fafc;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    -webkit-font-smoothing:antialiased;
}
.message-enter{
    animation:messageEnter .22s ease-out;
}
@keyframes messageEnter{
    from{
        opacity:0;
        transform:translateY(8px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}
/* =========================================================
   Intro
========================================================= */
#cqs-intro{
    position:fixed;
    inset:0;
    z-index:9999;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(59,130,246,.18),
            transparent 26%
        ),
        #020617;
    transition:
        opacity .8s ease,
        visibility .8s ease;
}
#cqs-intro.intro-hidden{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}
.intro-hex{
    position:relative;
    width:110px;
    height:110px;
    clip-path:
        polygon(
            25% 6.7%,
            75% 6.7%,
            100% 50%,
            75% 93.3%,
            25% 93.3%,
            0 50%
        );
    background:
        conic-gradient(
            from 0deg,
            #ff004c,
            #ff8a00,
            #ffe600,
            #20ff70,
            #00d9ff,
            #695cff,
            #ff28d7,
            #ff004c
        );
    animation:
        coreRotate 5s linear infinite;
    filter:
        drop-shadow(
            0 0 14px
            rgba(0,217,255,.35)
        );
    margin-bottom:24px;
}
@keyframes coreRotate{
    from{
        transform:rotate(0deg);
    }
    to{
        transform:rotate(360deg);
    }
}
/* =========================================================
   Thinking UI
========================================================= */
.reasoning-box{
    border:1px solid rgba(99,102,241,.20);
    background:rgba(15,23,42,.65);
    border-radius:16px;
    overflow:hidden;
    margin-bottom:8px;
}
.reasoning-header{
    display:flex;
    align-items:center;
    gap:8px;
    padding:10px 12px;
    font-size:12px;
    color:#a5b4fc;
    border-bottom:1px solid rgba(99,102,241,.12);
    user-select:none;
}
.reasoning-content{
    padding:11px 12px;
    color:#94a3b8;
    font-size:12px;
    line-height:1.65;
    white-space:pre-wrap;
    word-break:break-word;
    max-height:320px;
    overflow-y:auto;
}
.thinking-dot{
    display:inline-block;
    width:5px;
    height:5px;
    border-radius:50%;
    background:#818cf8;
    animation:
        thinkingPulse 1s infinite ease-in-out;
}
.thinking-dot:nth-child(2){
    animation-delay:.15s;
}
.thinking-dot:nth-child(3){
    animation-delay:.3s;
}
@keyframes thinkingPulse{
    0%,
    80%,
    100%{
        opacity:.25;
        transform:translateY(0);
    }
    40%{
        opacity:1;
        transform:translateY(-2px);
    }
}
/* =========================================================
   Privacy
========================================================= */
#privacy-banner{
    z-index:50;
}
/* =========================================================
   Mobile
========================================================= */
@media(max-width:480px){
    .intro-hex{
        width:92px;
        height:92px;
    }
    #chat-container{
        padding-left:12px;
        padding-right:12px;
    }
}
</style>

"use strict";
/* =========================================================

const $ = id =>

const chatContainer =

const userInput =

const langSelect =

const modelSelectBtn =

const privacyBanner =

const hiddenFileInput =

const attachmentBar =

const soundToggleBtn =

const soundIcon =
    $("sound-icon");
/* =========================================================
   STATE
========================================================= */
let currentLanguage =
    localStorage.getItem("cqs_lang") ||
    "zh";
let currentModel =
    localStorage.getItem("cqs_model") ||
    "DeepSeek";
let soundEnabled =
    localStorage.getItem("cqs_sound") !==
    "false";
let messages;
try {
    messages =
        JSON.parse(
            localStorage.getItem(
                "cqs_messages"
            ) || "[]"
        );
    if (!Array.isArray(messages)) {
        messages = [];
    }
} catch {
    messages = [];
}
let totalTokens =
    parseInt(
        localStorage.getItem(
            "cqs_tokens"
        ) || "0",
        10
    );
if (!Number.isFinite(totalTokens)) {
    totalTokens = 0;
}
let conversationId =
    localStorage.getItem(
        "cqs_conv_id"
    ) ||
    "cqs_" + Date.now();
let selectedAttachments = [];
let activeController = null;
let isGenerating = false;
/* =========================================================
   i18n
========================================================= */
const i18n = {

        privacyDesc:

/* =========================================================
   Speech
========================================================= */
const speechLangs = {
    zh: "zh-CN",
    en: "en-US",
    ja: "ja-JP",
    ko: "ko-KR",
    fr: "fr-FR",
    de: "de-DE",
    es: "es-ES",
    ar: "ar-SA"
};
/* =========================================================
   Audio
========================================================= */
const audioCtx =
    (
        typeof window !== "undefined" &&
        (
            window.AudioContext ||
            window.webkitAudioContext
        )
    )
        ? new (
            window.AudioContext ||
            window.webkitAudioContext
        )()
        : null;
function playSound(type) {
    if (
        !soundEnabled ||
        !audioCtx
    ) {
        return;
    }
    if (
        audioCtx.state ===
        "suspended"
    ) {
        audioCtx.resume();
    }
    const osc =
        audioCtx.createOscillator();
    const gain =
        audioCtx.createGain();
    osc.connect(gain);
    gain.connect(
        audioCtx.destination
    );
    const now =
        audioCtx.currentTime;
    if (type === "send") {
        osc.frequency.setValueAtTime(
            440,
            now
        );
        osc.frequency
            .exponentialRampToValueAtTime(
                880,
                now + .1
            );
        gain.gain.setValueAtTime(
            .08,
            now
        );
        gain.gain
            .linearRampToValueAtTime(
                0,
                now + .1
            );
        osc.start(now);
        osc.stop(now + .1);
    }
    else if (type === "receive") {
        osc.frequency.setValueAtTime(
            600,
            now
        );
        osc.frequency
            .exponentialRampToValueAtTime(
                300,
                now + .15
            );
        gain.gain.setValueAtTime(
            .06,
            now
        );
        gain.gain
            .linearRampToValueAtTime(
                0,
                now + .15
            );
        osc.start(now);
        osc.stop(now + .15);
    }
    else if (type === "thinking") {
        osc.frequency.setValueAtTime(
            260,
            now
        );
        osc.frequency
            .linearRampToValueAtTime(
                420,
                now + .12
            );
        gain.gain.setValueAtTime(
            .035,
            now
        );
        gain.gain
            .linearRampToValueAtTime(
                0,
                now + .12
            );
        osc.start(now);
        osc.stop(now + .12);
    }
}
/* =========================================================
   UI Strings
========================================================= */
function updateUIStrings() {
    const t =
        i18n[currentLanguage] ||
        i18n.en;
    $("txt-title").textContent =
        t.title;
    userInput.placeholder =
        t.inputPlaceholder;
    $("txt-privacy-desc").textContent =
        t.privacyDesc;
    privacyAccept.textContent =
        t.accept;
    langSelect.value =
        currentLanguage;
    $("current-model-name").textContent =
        currentModel;
    tokenCountEl.textContent =
        totalTokens.toLocaleString();
    document
        .querySelectorAll(
            ".model-option"
        )
        .forEach(opt => {
            const m =
                opt.getAttribute(
                    "data-model"
                );
            if (m === currentModel) {
                opt.classList.remove(
                    "text-slate-400"
                );
                opt.classList.add(
                    "text-slate-200"
                );
                if (
                    !opt.querySelector("i")
                ) {
                    opt.insertAdjacentHTML(
                        "beforeend",
                        '<i class="fa-solid fa-check text-indigo-400"></i>'
                    );
                }
            } else {
                opt.classList.remove(
                    "text-slate-200"
                );
                opt.classList.add(
                    "text-slate-400"
                );
                const icon =
                    opt.querySelector("i");
                if (icon) {
                    icon.remove();
                }
            }
        });
    soundIcon.className =
        soundEnabled
            ? "fa-solid fa-volume-high text-emerald-400"
            : "fa-solid fa-volume-xmark text-slate-500";
}
/* =========================================================
   Language
========================================================= */
langSelect.addEventListener(
    "change",
    e => {
        currentLanguage =
            e.target.value;
        localStorage.setItem(
            "cqs_lang",
            currentLanguage
        );
        updateUIStrings();
    }
);
/* =========================================================
   Sound
========================================================= */
soundToggleBtn.addEventListener(
    "click",
    () => {
        soundEnabled =
            !soundEnabled;
        localStorage.setItem(
            "cqs_sound",
            soundEnabled
        );
        updateUIStrings();
    }
);
/* =========================================================
   Privacy
========================================================= */
if (
    !localStorage.getItem(
        "cqs_privacy"
    )
) {
    privacyBanner.classList.remove(
        "hidden"
    );
}
privacyAccept.addEventListener(
    "click",
    () => {
        localStorage.setItem(
            "cqs_privacy",
            "true"
        );
        privacyBanner.classList.add(
            "hidden"
        );
    }
);
/* =========================================================
   Model Dropdown
========================================================= */
modelSelectBtn.addEventListener(
    "click",
    () => {
        modelDropdown.classList.toggle(
            "hidden"
        );
    }
);
document.addEventListener(
    "click",
    e => {
        if (
            !modelSelectBtn.contains(
                e.target
            ) &&
            !modelDropdown.contains(
                e.target
            )

                    "";

                        event.resultIndex;
                    i <

                    i++
                ) {
                    transcript +=
                        event.results[i][0]

            () => {

            () => {

/* =========================================================
   Send
========================================================= */
async function handleAction() {
    // =====================================================
    // Stop
    // =====================================================
    if (isGenerating) {
        if (activeController) {
            try {
                activeController.abort();
            } catch {}
        }
        isGenerating =
            false;
        setButtonState(
            "send"
        );
        return;
    }
    // =====================================================
    // Input
    // =====================================================
    const text =
        userInput.value.trim();
    if (
        !text &&
        selectedAttachments.length === 0
    ) {
        return;
    }
    // =====================================================
    // Attachments
    // =====================================================
    const currentAtts =
        selectedAttachments.map(
            att => ({
                name:
                    att.name,
                size:
                    att.size,
                type:
                    att.type
            })
        );
    selectedAttachments =
        [];
    renderAttachmentBar();
    userInput.value =
        "";
    const t =
        i18n[currentLanguage] ||
        i18n.en;
    // =====================================================
    // User UI
    // =====================================================
    appendUI(
        "user",
        text ||
            t.attachment,
        currentAtts
    );
    // =====================================================
    // User Message
    // =====================================================
    const userMessage = {
        role:
            "user",
        content:
            text,
        attachments:
            currentAtts,
        model:
            currentModel,
        timestamp:
            Date.now()
    };
    messages.push(
        userMessage
    );
    saveState();
    playSound(
        "send"
    );
    // =====================================================
    // Generation
    // =====================================================
    isGenerating =
        true;
    setButtonState(
        "stop"
    );
    activeController =
        new AbortController();
    // =====================================================
    // Assistant UI
    // =====================================================
    const assistantUI =
        createAssistantUI();
    let fullText =
        "";
    let reasoningText =
        "";
    let hasReasoning =
        false;
    let reasoningFinished =
        false;
    let hasReceivedAnswer =
        false;
    try {
        // =================================================
        // Context
        // =================================================
        const contextMessages =
            messages
                .filter(
                    m =>
                        m &&
                        (
                            m.role ===
                                "user" ||
                            m.role ===
                                "assistant"
                        ) &&
                        typeof
                            m.content ===
                            "string"
                )
                .map(
                    m => ({
                        role:
                            m.role,
                        content:
                            m.content
                    })
                );
        // =================================================
        // Request
        // =================================================
        const response =
            await fetch(
                "/api/chat",
                {
                    method:
                        "POST",
                    headers: {
                        "Content-Type":
                            "application/json",
                        "Accept":
                            "text/event-stream"
                    },
                    body:
                        JSON.stringify({
                            conversationId,
                            model:
                                currentModel,
                            messages:
                                contextMessages,
                            attachments:
                                currentAtts
                        }),
                    signal:
                        activeController.signal
                }
            );
        // =================================================
        // HTTP Error
        // =================================================
        if (!response.ok) {
            let errorMessage =
                `Gateway Error: HTTP ${response.status}`;
            try {
                const errorData =
                    await response.json();
                if (
                    errorData &&
                    typeof
                        errorData.error ===
                        "string"
                ) {
                    errorMessage =
                        errorData.error;
                }
            } catch {}
            if (
                response.status ===
                401
            ) {
                errorMessage =
                    "AI API Key 无效或已失效";
            }
            if (
                response.status ===
                429
            ) {
                errorMessage =
                    "AI 服务请求过于频繁，请稍后再试";
            }
            if (
                response.status >=
                500
            ) {
                errorMessage =
                    "AI 网关或上游服务暂时不可用";
            }
            throw new Error(
                errorMessage
            );
        }
        // =================================================
        // Stream
        // =================================================
        if (!response.body) {
            throw new Error(
                "服务器没有返回流式数据"
            );
        }
        const reader =
            response.body.getReader();
        const decoder =
            new TextDecoder(
                "utf-8"
            );
        let buffer =
            "";
        // =================================================
        // Stream Loop
        // =================================================
        while (true) {
            const {
                value,
                done
            } =
                await reader.read();
            if (done) {
                break;
            }
            buffer +=
                decoder.decode(
                    value,
                    {
                        stream:
                            true
                    }
                );
            const events =
                buffer.split(
                    /\r?\n\r?\n/
                );
            buffer =
                events.pop() ||
                "";
            for (
                const event
                of events
            ) {
                const lines =
                    event.split(
                        /\r?\n/
                    );
                const dataLines =
                    lines
                        .filter(
                            line =>
                                line.startsWith(
                                    "data:"
                                )
                        )
                        .map(
                            line =>
                                line
                                    .slice(5)
                                    .trim()
                        );
                if (
                    dataLines.length ===
                    0
                ) {
                    continue;
                }
                const data =
                    dataLines.join(
                        "\n"
                    );
                if (!data) {
                    continue;
                }
                let packet;
                try {
                    packet =
                        JSON.parse(
                            data
                        );
                } catch {
                    continue;
                }
                // =================================================
                // REASONING
                // =================================================
                if (
                    packet.type ===
                        "reasoning" &&
                    typeof
                        packet.content ===
                        "string"
                ) {
                    if (
                        !hasReasoning
                    ) {
                        hasReasoning =
                            true;
                        assistantUI
                            .reasoningBox
                            .classList.remove(
                                "hidden"
                            );
                        playSound(
                            "thinking"
                        );
                    }
                    reasoningText +=
                        packet.content;
                    assistantUI
                        .reasoningContent
                        .textContent =
                        reasoningText;
                    chatContainer.scrollTop =
                        chatContainer.scrollHeight;
                }
                // =================================================
                // FINAL ANSWER
                // =================================================
                if (
                    packet.type ===
                        "delta" &&
                    typeof
                        packet.content ===
                        "string"
                ) {
                    if (
                        hasReasoning &&
                        !reasoningFinished
                    ) {
                        reasoningFinished =
                            true;
                        assistantUI
                            .reasoningTitle
                            .textContent =
                            t.thinkingDone;
                        const dots =
                            assistantUI
                                .reasoningHeader
                                .querySelector(
                                    ".thinking-dot"
                                );
                        if (dots) {
                            assistantUI
                                .reasoningHeader
                                .querySelectorAll(
                                    ".thinking-dot"
                                )
                                .forEach(
                                    dot =>
                                        dot.remove()
                                );
                        }
                    }
                    hasReceivedAnswer =
                        true;
                    fullText +=
                        packet.content;
                    assistantUI
                        .bubble
                        .textContent =
                        fullText;
                    chatContainer.scrollTop =
                        chatContainer.scrollHeight;
                    if (
                        fullText.length %
                            8 ===
                        0
                    ) {
                        playSound(
                            "receive"
                        );
                    }
                }
                // =================================================
                // USAGE
                // =================================================
                if (
                    packet.type ===
                        "usage" &&
                    packet.usage
                ) {
                    const usage =
                        packet.usage;
                    if (
                        typeof
                            usage.total_tokens ===
                            "number"
                    ) {
                        totalTokens =
                            Number(
                                totalTokens ||
                                    0
                            ) +
                            usage.total_tokens;
                        tokenCountEl.textContent =
                            totalTokens.toLocaleString();
                        saveState();
                    }
                }
                // =================================================
                // ERROR
                // =================================================
                if (
                    packet.type ===
                        "error"
                ) {
                    throw new Error(
                        packet.error ||
                        "AI 流式请求失败"
                    );
                }
                // =================================================
                // DONE
                // =================================================
                if (
                    packet.type ===
                        "done"
                ) {
                    continue;
                }
            }
        }
        // =====================================================
        // Decoder Flush
        // =====================================================
        buffer +=
            decoder.decode();
        // =====================================================
        // Empty Response
        // =====================================================
        if (
            !fullText.trim() &&
            !reasoningText.trim()
        ) {
            throw new Error(
                "AI 返回了空响应"
            );
        }
        // =====================================================
        // Save Assistant
        // =====================================================
        messages.push({
            role:
                "assistant",
            content:
                fullText,
            model:
                currentModel,
            timestamp:
                Date.now()
        });
        saveState();
    } catch (err) {
        // =====================================================
        // Abort
        // =====================================================
        if (
            err &&
            err.name ===
                "AbortError"
        ) {
            const stoppedText =
