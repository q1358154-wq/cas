<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#020617">
    <title>AI 智能控制台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #020617;
        }
        body {
            min-height: 100vh;
            min-height: 100dvh;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        ::-webkit-scrollbar {
            width: 0;
            height: 0;
            display: none;
        }
        * {
            scrollbar-width: none;
        }
        .safe-top {
            padding-top: env(safe-area-inset-top);
        }
        .safe-bottom {
            padding-bottom: env(safe-area-inset-bottom);
        }
        input, textarea, button {
            font-size: 16px;
        }
        .message-enter {
            animation: messageEnter 0.2s ease-out;
        }
        @keyframes messageEnter {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .typing-dot {
            animation: typing 1.2s infinite ease-in-out;
        }
        .typing-dot:nth-child(2) {
            animation-delay: 0.15s;
        }
        .typing-dot:nth-child(3) {
            animation-delay: 0.3s;
        }
        @keyframes typing {
            0%, 60%, 100% {
                opacity: 0.25;
                transform: translateY(0);
            }
            30% {
                opacity: 1;
                transform: translateY(-2px);
            }
        }
        button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }
        #user-input {
            -webkit-appearance: none;
            appearance: none;
        }
        #user-input:focus {
            outline: none;
        }
        #history-drawer, .modal-overlay {
            transition: opacity 0.2s ease;
        }
        #history-panel {
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #history-drawer.hidden, .modal-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #history-drawer.hidden #history-panel {
            transform: translateX(-100%);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 overflow-hidden">
<div id="app" class="w-full flex flex-col bg-slate-950" style="height: 100vh; height: 100dvh; min-height: 100svh;">
    <header class="shrink-0 px-4 py-3 flex items-center justify-between border-b border-slate-800 bg-slate-900/90 backdrop-blur-md z-20 safe-top">
        <div class="flex items-center space-x-2">
            <button id="history-btn" type="button" aria-label="历史记录与菜单" class="w-9 h-9 flex items-center justify-center rounded-xl bg-slate-800 text-slate-300 active:scale-95 transition">
                <i class="fa-solid fa-bars"></i>
            </button>
            <h1 id="current-title" class="text-base font-semibold tracking-wide">AI 对话中心</h1>
        </div>
        <div class="flex items-center space-x-3">
            <div class="text-xs bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 px-2.5 py-1 rounded-full font-mono">
                用量: <span id="token-count">0</span> tokens
            </div>
            <button id="export-btn" type="button" aria-label="导出聊天记录" class="w-9 h-9 flex items-center justify-center rounded-xl bg-indigo-600 text-white active:scale-95 transition">
                <i class="fa-solid fa-download text-sm"></i>
            </button>
        </div>
    </header>

    <main id="chat-container" class="flex-1 relative overflow-y-auto overscroll-contain p-4 space-y-4" style="padding-bottom: 110px;">
        <div class="flex items-start space-x-3 chat-bubble message-enter">
            <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center shrink-0">
                <i class="fa-solid fa-robot text-xs text-white"></i>
            </div>
            <div id="welcome-msg" class="bg-slate-900 border border-slate-800 rounded-2xl p-3.5 max-w-[80%] text-sm text-slate-200 shadow-lg">
                你好！我是你的 AI 助手，请在下方输入框与我开始对话。
            </div>
        </div>
    </main>

    <nav class="shrink-0 p-3 bg-slate-900/95 border-t border-slate-800 backdrop-blur-lg z-20 flex items-center space-x-2 safe-bottom">
        <input type="text" id="user-input" autocomplete="off" autocapitalize="sentences" enterkeyhint="send" placeholder="输入消息..." class="flex-1 min-w-0 bg-slate-800 text-slate-100 placeholder-slate-500 text-base rounded-xl px-4 py-3 border border-slate-700/60 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/30 transition">
        <button id="send-btn" type="button" aria-label="发送消息" class="w-12 h-12 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl flex items-center justify-center shrink-0 active:scale-95 transition shadow-lg shadow-indigo-600/30">
            <i class="fa-solid fa-paper-plane"></i>
        </button>
    </nav>

    <div id="history-drawer" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden">
        <div id="history-panel" class="absolute left-0 top-0 bottom-0 w-4/5 max-w-xs bg-slate-900 border-r border-slate-800 p-4 flex flex-col safe-top safe-bottom">
            <div class="flex items-center justify-between pb-3 border-b border-slate-800 mb-3">
                <h2 class="text-sm font-semibold text-slate-200 flex items-center space-x-2">
                    <i class="fa-solid fa-compass text-indigo-400"></i>
                    <span>控制台菜单</span>
                </h2>
                <button id="close-drawer" type="button" aria-label="关闭菜单" class="text-slate-400 hover:text-white w-8 h-8 flex items-center justify-center rounded-lg hover:bg-slate-800">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <button id="new-chat-btn" type="button" class="w-full mb-3 py-2.5 px-4 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-sm font-medium flex items-center space-x-2 shadow-lg shadow-indigo-600/20 active:scale-98 transition">
                <i class="fa-solid fa-plus"></i>
                <span>开启新话题</span>
            </button>

            <div class="space-y-1.5 mb-3 pb-3 border-b border-slate-800">
                <div class="text-[11px] font-semibold text-slate-500 uppercase tracking-wider px-1 mb-1">系统功能</div>
                <button id="deploy-skill-btn" type="button" class="w-full py-2 px-3 bg-slate-800/50 hover:bg-slate-800 text-slate-300 rounded-xl text-xs flex items-center justify-between transition">
                    <span class="flex items-center space-x-2"><i class="fa-solid fa-wand-magic-sparkles text-indigo-400"></i><span>部署 Skill</span></span>
                    <i class="fa-solid fa-plus text-[10px] text-slate-500"></i>
                </button>
                <button id="deploy-agent-btn" type="button" class="w-full py-2 px-3 bg-slate-800/50 hover:bg-slate-800 text-slate-300 rounded-xl text-xs flex items-center justify-between transition">
                    <span class="flex items-center space-x-2"><i class="fa-solid fa-brain text-emerald-400"></i><span>部署 Agent</span></span>
                    <i class="fa-solid fa-plus text-[10px] text-slate-500"></i>
                </button>
            </div>

            <div id="deployed-section" class="space-y-2 mb-3 pb-3 border-b border-slate-800 hidden">
                <div class="text-[11px] font-semibold text-slate-500 uppercase tracking-wider px-1">我的技能与智能体</div>
                <div id="deployed-list" class="space-y-1"></div>
            </div>

            <div class="text-[11px] font-semibold text-slate-500 uppercase tracking-wider px-1 mb-1">历史对话</div>
            <div id="history-list" class="flex-1 overflow-y-auto space-y-1.5"></div>
        </div>
    </div>

    <div id="config-modal" class="modal-overlay fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-2xl p-5 shadow-2xl space-y-4">
            <div class="flex items-center justify-between pb-2 border-b border-slate-800">
                <h3 id="modal-title" class="text-sm font-semibold text-slate-200">配置</h3>
                <button id="close-modal" type="button" class="text-slate-400 hover:text-white w-7 h-7 flex items-center justify-center rounded-lg hover:bg-slate-800">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1" id="label-name">名称</label>
                    <input type="text" id="modal-name-input" class="w-full bg-slate-800 text-slate-100 text-sm rounded-xl px-3 py-2 border border-slate-700 focus:border-indigo-500 focus:outline-none" placeholder="例如：翻译专家">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1" id="label-desc">设定 / 系统提示词 (System Prompt)</label>
                    <textarea id="modal-desc-input" rows="3" class="w-full bg-slate-800 text-slate-100 text-sm rounded-xl px-3 py-2 border border-slate-700 focus:border-indigo-500 focus:outline-none resize-none" placeholder="输入具体的行为设定或规则..."></textarea>
                </div>
            </div>
            <div class="flex space-x-2 pt-2">
                <button id="modal-cancel-btn" type="button" class="flex-1 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-medium transition">取消</button>
                <button id="modal-save-btn" type="button" class="flex-1 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-medium transition shadow-lg shadow-indigo-600/30">确认部署</button>
            </div>
        </div>
    </div>
</div>

<script>
    const chatContainer = document.getElementById('chat-container');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const tokenCountEl = document.getElementById('token-count');
    const exportBtn = document.getElementById('export-btn');
    const historyBtn = document.getElementById('history-btn');
    const historyDrawer = document.getElementById('history-drawer');
    const closeDrawer = document.getElementById('close-drawer');
    const historyList = document.getElementById('history-list');
    const newChatBtn = document.getElementById('new-chat-btn');
    const currentTitleEl = document.getElementById('current-title');
    const welcomeMsgEl = document.getElementById('welcome-msg');

    const deploySkillBtn = document.getElementById('deploy-skill-btn');
    const deployAgentBtn = document.getElementById('deploy-agent-btn');
    const deployedSection = document.getElementById('deployed-section');
    const deployedList = document.getElementById('deployed-list');

    const configModal = document.getElementById('config-modal');
    const closeModal = document.getElementById('close-modal');
    const modalCancelBtn = document.getElementById('modal-cancel-btn');
    const modalSaveBtn = document.getElementById('modal-save-btn');
    const modalTitle = document.getElementById('modal-title');
    const modalNameInput = document.getElementById('modal-name-input');
    const modalDescInput = document.getElementById('modal-desc-input');

    let messages = [];
    let totalTokens = 0;
    let isSending = false;
    let currentMode = 'chat';
    let currentSystemPrompt = '';
    let deployedItems = [];

    try {
        const savedMessages = localStorage.getItem('chat_messages');
        const savedTokens = localStorage.getItem('total_tokens');
        const savedDeployed = localStorage.getItem('deployed_items');
        if (savedMessages) {
            const parsed = JSON.parse(savedMessages);
            if (Array.isArray(parsed)) messages = parsed;
        }
        if (savedTokens) {
            const parsedTokens = parseInt(savedTokens, 10);
            if (!Number.isNaN(parsedTokens)) totalTokens = parsedTokens;
        }
        if (savedDeployed) {
            const parsedD = JSON.parse(savedDeployed);
            if (Array.isArray(parsedD)) deployedItems = parsedD;
        }
    } catch (error) {
        console.error('Storage read error:', error);
    }
    tokenCountEl.textContent = totalTokens;

    function saveState() {
        try {
            localStorage.setItem('chat_messages', JSON.stringify(messages));
            localStorage.setItem('total_tokens', String(totalTokens));
            localStorage.setItem('deployed_items', JSON.stringify(deployedItems));
        } catch (error) {
            console.error('Storage save error:', error);
        }
    }

    function renderDeployedItems() {
        if (!deployedItems.length) {
            deployedSection.classList.add('hidden');
            return;
        }
        deployedSection.classList.remove('hidden');
        deployedList.innerHTML = '';
        deployedItems.forEach((item, index) => {
            const el = document.createElement('div');
            el.className = 'p-2 bg-slate-800/40 rounded-xl text-xs flex items-center justify-between group hover:bg-slate-800 transition cursor-pointer';
            
            const leftDiv = document.createElement('div');
            leftDiv.className = 'flex items-center space-x-2 truncate';
            const icon = document.createElement('i');
            icon.className = item.type === 'skill' ? 'fa-solid fa-wand-magic-sparkles text-indigo-400' : 'fa-solid fa-brain text-emerald-400';
            
            const textSpan = document.createElement('span');
            textSpan.className = 'text-slate-300 truncate';
            textSpan.textContent = item.name;
            
            leftDiv.appendChild(icon);
            leftDiv.appendChild(textSpan);
            leftDiv.addEventListener('click', () => {
                activateItem(item);
            });

            const delBtn = document.createElement('button');
            delBtn.className = 'text-slate-500 hover:text-red-400 px-1';
            delBtn.innerHTML = '<i class="fa-solid fa-trash text-[10px]"></i>';
            delBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                deployedItems.splice(index, 1);
                saveState();
                renderDeployedItems();
            });

            el.appendChild(leftDiv);
            el.appendChild(delBtn);
            deployedList.appendChild(el);
        });
    }
    renderDeployedItems();

    function activateItem(item) {
        currentSystemPrompt = item.prompt;
        currentTitleEl.textContent = `${item.type === 'skill' ? 'Skill' : 'Agent'}: ${item.name}`;
        welcomeMsgEl.textContent = `已加载 [${item.name}] 设定：${item.prompt}`;
        closeHistory();
    }

    function appendUI(role, text, save = true) {
        const isUser = role === 'user';
        const wrapper = document.createElement('div');
        wrapper.className = `flex items-start space-x-3 chat-bubble message-enter ${isUser ? 'flex-row-reverse space-x-reverse' : ''}`;

        const avatar = document.createElement('div');
        avatar.className = `w-8 h-8 rounded-full ${isUser ? 'bg-emerald-600' : 'bg-indigo-600'} flex items-center justify-center shrink-0`;
        const icon = document.createElement('i');
        icon.className = `fa-solid ${isUser ? 'fa-user' : 'fa-robot'} text-xs text-white`;
        avatar.appendChild(icon);

        const bubble = document.createElement('div');
        bubble.className = `${isUser ? 'bg-indigo-600 text-white' : 'bg-slate-900 border border-slate-800 text-slate-200'} rounded-2xl p-3.5 max-w-[80%] text-sm shadow-lg whitespace-pre-wrap break-words`;
        bubble.textContent = text;

        wrapper.appendChild(avatar);
        wrapper.appendChild(bubble);
        chatContainer.appendChild(wrapper);

        requestAnimationFrame(() => {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        });

        if (save) {
            messages.push({ role, content: text });
            totalTokens += text.length;
            tokenCountEl.textContent = totalTokens;
            saveState();
        }
        return wrapper;
    }

    function createLoading() {
        const wrapper = document.createElement('div');
        wrapper.className = 'flex items-start space-x-3 chat-bubble message-enter';
        wrapper.id = 'loading-message';
        const avatar = document.createElement('div');
        avatar.className = 'w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center shrink-0';
        const robot = document.createElement('i');
        robot.className = 'fa-solid fa-robot text-xs text-white';
        avatar.appendChild(robot);

        const bubble = document.createElement('div');
        bubble.className = 'bg-slate-900 border border-slate-800 rounded-2xl p-3.5 text-sm text-slate-400 flex items-center space-x-1';
        for (let i = 0; i < 3; i++) {
            const dot = document.createElement('span');
            dot.className = 'typing-dot';
            dot.textContent = '●';
            bubble.appendChild(dot);
        }
        wrapper.appendChild(avatar);
        wrapper.appendChild(bubble);
        chatContainer.appendChild(wrapper);
        requestAnimationFrame(() => {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        });
        return wrapper;
    }

    function removeLoading() {
        const loading = document.getElementById('loading-message');
        if (loading) loading.remove();
    }

    function renderMessages() {
        if (!messages.length) return;
        messages.forEach(message => {
            if (message && (message.role === 'user' || message.role === 'assistant')) {
                appendUI(message.role, String(message.content || ''), false);
            }
        });
    }
    renderMessages();

    async function handleSend() {
        if (isSending) return;
        const text = userInput.value.trim();
        if (!text) return;

        isSending = true;
        sendBtn.disabled = true;
        userInput.disabled = true;
        userInput.value = '';

        appendUI('user', text, true);
        createLoading();

        try {
            let finalMessages = messages.map(m => ({ role: m.role, content: m.content }));
            if (currentSystemPrompt && finalMessages.length === 1) {
                finalMessages.unshift({ role: 'system', content: currentSystemPrompt });
            }

            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify({ messages: finalMessages })
            });

            let data;
            try {
                data = await response.json();
            } catch {
                throw new Error(`服务器返回了无法解析的数据 (${response.status})`);
            }

            removeLoading();

            if (!response.ok) {
                let errorMessage = data?.error || '服务器请求失败';
                if (data?.detail) errorMessage += `\n${data.detail}`;
                appendUI('assistant', `⚠️ 错误: ${errorMessage}`, true);
                return;
            }

            const reply = data?.reply || data?.choices?.[0]?.message?.content;
            if (!reply) {
                appendUI('assistant', '⚠️ 错误: 未获取到有效的 AI 回复。', true);
                return;
            }

            appendUI('assistant', reply, true);
            if (data?.usage?.total_tokens) {
                tokenCountEl.textContent = data.usage.total_tokens;
            }
        } catch (error) {
            removeLoading();
            let message = error?.message || '网络连接异常';
            if (message === 'Failed to fetch') {
                message = '无法连接服务器，请检查 Vercel 部署或网络连接。';
            }
            appendUI('assistant', `⚠️ ${message}`, true);
        } finally {
            isSending = false;
            sendBtn.disabled = false;
            userInput.disabled = false;
            userInput.focus();
        }
    }

    sendBtn.addEventListener('click', handleSend);
    userInput.addEventListener('keydown', event => {
        if (event.key === 'Enter' && !event.shiftKey) {
            event.preventDefault();
            handleSend();
        }
    });

    function startNewChat() {
        messages = [];
        totalTokens = 0;
        currentSystemPrompt = '';
        currentTitleEl.textContent = 'AI 对话中心';
        tokenCountEl.textContent = '0';
        localStorage.removeItem('chat_messages');
        localStorage.removeItem('total_tokens');

        chatContainer.innerHTML = `
            <div class="flex items-start space-x-3 chat-bubble message-enter">
                <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center shrink-0">
                    <i class="fa-solid fa-robot text-xs text-white"></i>
                </div>
                <div id="welcome-msg" class="bg-slate-900 border border-slate-800 rounded-2xl p-3.5 max-w-[80%] text-sm text-slate-200 shadow-lg">
                    你好！我是你的 AI 助手，请在下方输入框与我开始对话。
                </div>
            </div>
        `;
        closeHistory();
    }
    newChatBtn.addEventListener('click', startNewChat);

    function openConfigModal(type) {
        currentMode = type;
        closeHistory();
        modalTitle.textContent = type === 'skill' ? '部署新 Skill (技能)' : '部署新 Agent (智能体)';
        modalNameInput.value = '';
        modalDescInput.value = '';
        modalNameInput.placeholder = type === 'skill' ? '例如：代码审查助手' : '例如：全栈架构师';
        modalDescInput.placeholder = type === 'skill' ? '输入该技能的具体提示词规则...' : '输入该智能体的人设与背景描述...';
        configModal.classList.remove('hidden');
    }

    deploySkillBtn.addEventListener('click', () => openConfigModal('skill'));
    deployAgentBtn.addEventListener('click', () => openConfigModal('agent'));

    function closeConfigModal() {
        configModal.classList.add('hidden');
    }
    closeModal.addEventListener('click', closeConfigModal);
    modalCancelBtn.addEventListener('click', closeConfigModal);

    modalSaveBtn.addEventListener('click', () => {
        const name = modalNameInput.value.trim();
        const prompt = modalDescInput.value.trim();
        if (!name || !prompt) {
            alert('请完整填写名称和设定说明！');
            return;
        }

        deployedItems.push({
            type: currentMode,
            name: name,
            prompt: prompt
        });
        saveState();
        renderDeployedItems();
        closeConfigModal();
    });

    exportBtn.addEventListener('click', () => {
        try {
            const json = JSON.stringify(messages, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const anchor = document.createElement('a');
            anchor.href = url;
            anchor.download = `chat_history_${Date.now()}.json`;
            document.body.appendChild(anchor);
            anchor.click();
            anchor.remove();
            URL.revokeObjectURL(url);
        } catch (error) {
            console.error('Export error:', error);
        }
    });

    historyBtn.addEventListener('click', () => {
        historyList.innerHTML = '';
        if (!messages.length) {
            const empty = document.createElement('div');
            empty.className = 'text-xs text-slate-500 text-center py-4';
            empty.textContent = '暂无历史记录';
            historyList.appendChild(empty);
        } else {
            messages.forEach(message => {
                if (message.role !== 'user') return;
                const item = document.createElement('div');
                item.className = 'p-2.5 bg-slate-800/40 rounded-xl text-xs text-slate-300 truncate cursor-pointer hover:bg-slate-800 active:bg-slate-700 transition';
                item.textContent = message.content;
                item.addEventListener('click', () => {
                    userInput.value = message.content;
                    closeHistory();
                    userInput.focus();
                });
                historyList.appendChild(item);
            });
        }
        historyDrawer.classList.remove('hidden');
    });

    function closeHistory() {
        historyDrawer.classList.add('hidden');
    }
    closeDrawer.addEventListener('click', closeHistory);
    historyDrawer.addEventListener('click', event => {
        if (event.target === historyDrawer) closeHistory();
    });
    document.addEventListener('keydown', event => {
        if (event.key === 'Escape') {
            closeHistory();
            closeConfigModal();
        }
    });
</script>
</body>
</html>
