<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#020617">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="CQS AI Global — Multi Provider AI Interface">
<title>CQS AI Global</title>
<style>
:root{
    --bg:#020617;
    --bg-soft:#07101f;
    --panel:#0b1220;
    --panel-2:#0f172a;
    --panel-3:#111c31;
    --border:rgba(148,163,184,.13);
    --border-strong:rgba(148,163,184,.22);
    --text:#f8fafc;
    --muted:#94a3b8;
    --muted-2:#64748b;
    --accent:#8b5cf6;
    --accent-2:#6366f1;
    --danger:#ef4444;
    --success:#22c55e;
    --radius:18px;
    --sidebar:280px;
    --header:64px;
    --input-max:760px;
    --vh:100vh;
}
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}
html,
body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
    overflow:hidden;
    background:var(--bg);
    color:var(--text);
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Segoe UI",
        sans-serif;
}
button,
textarea,
input{
    font:inherit;
}
button{
    border:0;
    cursor:pointer;
    color:inherit;
}
button:disabled{
    cursor:not-allowed;
    opacity:.55;
}
.app{
    width:100%;
    height:var(--vh);
    min-height:100%;
    display:flex;
    position:relative;
    overflow:hidden;
    background:
        radial-gradient(
            circle at 70% 0%,
            rgba(99,102,241,.08),
            transparent 35%
        ),
        var(--bg);
}
/* =========================================================
   SIDEBAR
   ========================================================= */
.sidebar{
    width:var(--sidebar);
    height:100%;
    flex:0 0 var(--sidebar);
    display:flex;
    flex-direction:column;
    background:rgba(3,8,20,.96);
    border-right:1px solid var(--border);
    z-index:50;
}
.sidebar-top{
    padding:18px 14px 12px;
}
.brand{
    display:flex;
    align-items:center;
    gap:11px;
    padding:5px 7px 17px;
}
.brand-mark{
    width:36px;
    height:36px;
    border-radius:11px;
    display:grid;
    place-items:center;
    background:
        linear-gradient(
            135deg,
            #8b5cf6,
            #4f46e5
        );
    box-shadow:
        0 8px 25px rgba(99,102,241,.28);
    font-weight:800;
}
.brand-name{
    font-size:16px;
    font-weight:750;
    letter-spacing:.1px;
}
.brand-sub{
    font-size:11px;
    color:var(--muted-2);
    margin-top:2px;
}
.new-chat{
    width:100%;
    height:44px;
    border-radius:13px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    background:
        linear-gradient(
            135deg,
            rgba(124,58,237,.95),
            rgba(79,70,229,.95)
        );
    box-shadow:
        0 8px 22px rgba(79,70,229,.16);
    font-weight:650;
}
.new-chat:hover{
    filter:brightness(1.08);
}
.sidebar-section{
    padding:16px 14px 8px;
}
.section-title{
    padding:0 8px 8px;
    font-size:11px;
    color:var(--muted-2);
    text-transform:uppercase;
    letter-spacing:.09em;
}
.history{
    flex:1;
    min-height:0;
    overflow:auto;
    padding:0 8px 12px;
}
.history::-webkit-scrollbar,
.chat::-webkit-scrollbar{
    width:4px;
}
.history::-webkit-scrollbar-thumb,
.chat::-webkit-scrollbar-thumb{
    background:rgba(148,163,184,.16);
    border-radius:20px;
}
.history-item{
    width:100%;
    min-height:44px;
    display:flex;
    align-items:center;
    gap:9px;
    padding:7px 8px;
    margin-bottom:3px;
    border-radius:11px;
    background:transparent;
    color:var(--muted);
    text-align:left;
}
.history-item:hover,
.history-item.active{
    background:rgba(148,163,184,.075);
    color:var(--text);
}
.history-icon{
    width:22px;
    flex:0 0 22px;
    color:var(--muted-2);
    text-align:center;
}
.history-title{
    flex:1;
    min-width:0;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    font-size:13px;
}
.history-delete{
    width:25px;
    height:25px;
    flex:0 0 25px;
    border-radius:7px;
    background:transparent;
    color:var(--muted-2);
    opacity:0;
}
.history-item:hover .history-delete{
    opacity:1;
}
.history-delete:hover{
    color:#fca5a5;
    background:rgba(239,68,68,.1);
}
.empty-history{
    padding:22px 10px;
    text-align:center;
    color:var(--muted-2);
    font-size:12px;
}
.sidebar-bottom{
    border-top:1px solid var(--border);
    padding:10px;
}
.sidebar-action{
    width:100%;
    height:40px;
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 10px;
    border-radius:10px;
    background:transparent;
    color:var(--muted);
    text-align:left;
}
.sidebar-action:hover{
    color:var(--text);
    background:rgba(148,163,184,.07);
}
/* =========================================================
   MAIN
   ========================================================= */
.main{
    min-width:0;
    flex:1;
    height:100%;
    display:flex;
    flex-direction:column;
    position:relative;
}
.header{
    height:var(--header);
    flex:0 0 var(--header);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    border-bottom:1px solid var(--border);
    background:rgba(2,6,23,.72);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    z-index:20;
}
.header-left,
.header-right{
    display:flex;
    align-items:center;
    gap:8px;
}
.mobile-menu{
    display:none;
}
.model-select{
    position:relative;
}
.model-button{
    min-width:170px;
    height:38px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:0 12px;
    border:1px solid var(--border);
    border-radius:11px;
    background:rgba(15,23,42,.72);
    color:var(--text);
}
.model-button:hover{
    border-color:var(--border-strong);
}
.model-name{
    font-size:13px;
    font-weight:650;
}
.model-arrow{
    color:var(--muted-2);
    font-size:11px;
}
.model-menu{
    display:none;
    position:absolute;
    top:46px;
    left:0;
    width:245px;
    padding:7px;
    border:1px solid var(--border-strong);
    border-radius:14px;
    background:#0b1220;
    box-shadow:0 20px 50px rgba(0,0,0,.45);
    z-index:100;
}
.model-menu.show{
    display:block;
}
.model-group{
    padding:7px 8px 5px;
    color:var(--muted-2);
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:.08em;
}
.model-option{
    width:100%;
    display:flex;
    align-items:center;
    gap:9px;
    padding:10px;
    border-radius:10px;
    background:transparent;
    text-align:left;
}
.model-option:hover,
.model-option.active{
    background:rgba(139,92,246,.1);
}
.model-status{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--muted-2);
}
.model-option.active .model-status{
    background:var(--success);
    box-shadow:0 0 8px rgba(34,197,94,.6);
}
.model-info{
    min-width:0;
    flex:1;
}
.model-label{
    display:block;
    font-size:13px;
}
.model-desc{
    display:block;
    margin-top:2px;
    color:var(--muted-2);
    font-size:10px;
}
.header-button{
    width:38px;
    height:38px;
    border-radius:10px;
    background:transparent;
    color:var(--muted);
    display:grid;
    place-items:center;
    font-size:16px;
}
.header-button:hover{
    background:rgba(148,163,184,.08);
    color:var(--text);
}
/* =========================================================
   CHAT
   ========================================================= */
.chat{
    flex:1;
    min-height:0;
    overflow-y:auto;
    overflow-x:hidden;
    scroll-behavior:smooth;
}
.chat-inner{
    width:100%;
    max-width:900px;
    margin:0 auto;
    padding:40px 22px 190px;
}
.welcome{
    min-height:calc(var(--vh) - 250px);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
}
.welcome-mark{
    width:62px;
    height:62px;
    display:grid;
    place-items:center;
    margin-bottom:22px;
    border-radius:19px;
    background:
        linear-gradient(
            135deg,
            #8b5cf6,
            #4f46e5
        );
    box-shadow:
        0 18px 45px rgba(79,70,229,.25);
    font-size:24px;
    font-weight:800;
}
.welcome-title{
    margin:0;
    font-size:clamp(28px,5vw,44px);
    line-height:1.1;
    font-weight:780;
    letter-spacing:-.04em;
}
.letter{
    display:inline-block;
    opacity:0;
    transform:translateY(9px);
    animation:letterIn .5s ease forwards;
}
@keyframes letterIn{
    to{
        opacity:1;
        transform:none;
    }
}
.welcome-sub{
    max-width:620px;
    margin:15px auto 28px;
    color:var(--muted);
    font-size:14px;
    line-height:1.7;
}
.quick-actions{
    width:100%;
    max-width:760px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:9px;
}
.quick-action{
    min-height:64px;
    padding:10px;
    border:1px solid var(--border);
    border-radius:13px;
    background:rgba(15,23,42,.55);
    color:var(--muted);
    text-align:left;
    transition:.18s ease;
}
.quick-action:hover{
    transform:translateY(-1px);
    border-color:rgba(139,92,246,.35);
    color:var(--text);
    background:rgba(139,92,246,.07);
}
.quick-title{
    display:block;
    font-size:12px;
    font-weight:650;
}
.quick-desc{
    display:block;
    margin-top:4px;
    font-size:10px;
    color:var(--muted-2);
}
/* =========================================================
   MESSAGES
   ========================================================= */
.message{
    display:flex;
    gap:13px;
    margin-bottom:30px;
    animation:messageIn .22s ease;
}
@keyframes messageIn{
    from{
        opacity:0;
        transform:translateY(4px);
    }
    to{
        opacity:1;
        transform:none;
    }
}
.avatar{
    width:34px;
    height:34px;
    flex:0 0 34px;
    display:grid;
    place-items:center;
    border-radius:10px;
    background:rgba(148,163,184,.1);
    color:var(--muted);
    font-size:12px;
    font-weight:750;
}
.message.assistant .avatar{
    background:
        linear-gradient(
            135deg,
            rgba(139,92,246,.9),
            rgba(79,70,229,.9)
        );
    color:white;
}
.message-body{
    min-width:0;
    flex:1;
}
.message-meta{
    margin:1px 0 8px;
    color:var(--muted-2);
    font-size:11px;
    font-weight:650;
}
.message.user .message-body{
    background:rgba(15,23,42,.6);
    border:1px solid var(--border);
    border-radius:15px;
    padding:11px 14px;
}
.message.user .message-meta{
    margin-bottom:5px;
}
.message-content{
    color:#e5e7eb;
    font-size:14px;
    line-height:1.75;
    overflow-wrap:anywhere;
}
.message-content p{
    margin:0 0 12px;
}
.message-content p:last-child{
    margin-bottom:0;
}
.message-content strong{
    color:#fff;
}
.message-content em{
    color:#cbd5e1;
}
.message-content code{
    padding:2px 5px;
    border-radius:5px;
    background:rgba(148,163,184,.12);
    font-family:
        "SFMono-Regular",
        Consolas,
        monospace;
    font-size:.9em;
}
.message-content pre{
    margin:12px 0;
    padding:14px;
    overflow:auto;
    border:1px solid var(--border);
    border-radius:11px;
    background:#020617;
}
.message-content pre code{
    padding:0;
    background:none;
}
.md-quote{
    padding:6px 11px;
    margin:7px 0;
    border-left:2px solid #8b5cf6;
    color:#cbd5e1;
    background:rgba(139,92,246,.05);
}
.message-actions{
    display:flex;
    gap:5px;
    margin-top:8px;
}
.message-action{
    width:29px;
    height:29px;
    border-radius:8px;
    background:rgba(148,163,184,.06);
    color:var(--muted-2);
}
.message-action:hover{
    color:var(--text);
    background:rgba(148,163,184,.12);
}
/* =========================================================
   THINKING
   ========================================================= */
.thinking-box{
    margin-bottom:11px;
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
    background:rgba(15,23,42,.35);
}
.thinking-header{
    width:100%;
    min-height:38px;
    display:flex;
    align-items:center;
    gap:8px;
    padding:0 11px;
    background:transparent;
    color:var(--muted);
    font-size:11px;
    text-align:left;
}
.thinking-icon{
    font-size:13px;
}
.thinking-dots{
    display:flex;
    gap:3px;
    margin-left:3px;
}
.thinking-dots span{
    width:4px;
    height:4px;
    border-radius:50%;
    background:var(--muted-2);
    animation:dot 1.2s infinite;
}
.thinking-dots span:nth-child(2){
    animation-delay:.15s;
}
.thinking-dots span:nth-child(3){
    animation-delay:.3s;
}
@keyframes dot{
    0%,80%,100%{opacity:.3}
    40%{opacity:1}
}
.thinking-content{
    display:none;
    padding:0 12px 12px;
    max-height:260px;
    overflow:auto;
    white-space:pre-wrap;
    color:var(--muted-2);
    font-size:11px;
    line-height:1.65;
}
.thinking-box.open .thinking-content{
    display:block;
}
/* =========================================================
   COMPOSER
   ========================================================= */
.composer-area{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    padding:
        14px
        max(18px,env(safe-area-inset-right))
        max(18px,env(safe-area-inset-bottom))
        max(18px,env(safe-area-inset-left));
    background:
        linear-gradient(
            to top,
            rgba(2,6,23,1) 25%,
            rgba(2,6,23,.88) 70%,
            transparent
        );
    z-index:15;
}
.composer{
    width:100%;
    max-width:var(--input-max);
    margin:0 auto;
    border:1px solid var(--border-strong);
    border-radius:17px;
    background:rgba(10,18,32,.92);
    box-shadow:
        0 20px 55px rgba(0,0,0,.35);
    backdrop-filter:blur(18px);
}
.attachments{
    display:none;
    flex-wrap:wrap;
    gap:7px;
    padding:10px 12px 0;
}
.attachments.show{
    display:flex;
}
.attachment{
    max-width:240px;
    display:flex;
    align-items:center;
    gap:6px;
    padding:6px 8px;
    border-radius:8px;
    background:rgba(148,163,184,.08);
    color:var(--muted);
    font-size:11px;
}
.attachment-name{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}
.composer-row{
    display:flex;
    align-items:flex-end;
    gap:7px;
    padding:9px;
}
.input{
    flex:1;
    min-width:0;
    max-height:180px;
    min-height:40px;
    resize:none;
    border:0;
    outline:none;
    background:transparent;
    color:var(--text);
    padding:9px 5px;
    line-height:1.5;
}
.input::placeholder{
    color:var(--muted-2);
}
.composer-button{
    width:38px;
    height:38px;
    flex:0 0 38px;
    border-radius:10px;
    display:grid;
    place-items:center;
    background:transparent;
    color:var(--muted);
}
.composer-button:hover{
    background:rgba(148,163,184,.08);
    color:var(--text);
}
.send-button{
    background:
        linear-gradient(
            135deg,
            #8b5cf6,
            #4f46e5
        );
    color:white;
}
.send-button:hover{
    filter:brightness(1.08);
}
.send-button svg{
    width:17px;
    height:17px;
    fill:none;
    stroke:currentColor;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
}
.stop-btn{
    background:#ef4444;
}
/* =========================================================
   STATUS
   ========================================================= */
.status{
    position:absolute;
    left:50%;
    top:70px;
    transform:translateX(-50%);
    display:flex;
    align-items:center;
    gap:6px;
    padding:5px 9px;
    border:1px solid var(--border);
    border-radius:20px;
    background:rgba(2,6,23,.62);
    color:var(--muted-2);
    font-size:10px;
    pointer-events:none;
    z-index:10;
    opacity:.85;
}
.status-dot{
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--success);
}
.status-dot.busy{
    background:#f59e0b;
    box-shadow:0 0 8px rgba(245,158,11,.5);
}
/* =========================================================
   OVERLAY / MODALS
   ========================================================= */
.overlay{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    padding:18px;
    background:rgba(0,0,0,.62);
    backdrop-filter:blur(7px);
    z-index:200;
}
.overlay.show{
    display:flex;
}
.modal{
    width:min(480px,100%);
    max-height:min(720px,90vh);
    overflow:auto;
    border:1px solid var(--border-strong);
    border-radius:20px;
    background:#0b1220;
    box-shadow:0 30px 80px rgba(0,0,0,.5);
}
.modal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 19px;
    border-bottom:1px solid var(--border);
}
.modal-title{
    font-size:15px;
    font-weight:700;
}
.modal-close{
    width:30px;
    height:30px;
    border-radius:8px;
    background:transparent;
    color:var(--muted);
}
.modal-close:hover{
    background:rgba(148,163,184,.08);
    color:var(--text);
}
.modal-body{
    padding:18px;
}
.setting-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    min-height:52px;
    padding:8px 0;
    border-bottom:1px solid var(--border);
}
.setting-row:last-child{
    border-bottom:0;
}
.setting-main{
    min-width:0;
}
.setting-title{
    font-size:13px;
    font-weight:600;
}
.setting-desc{
    margin-top:4px;
    color:var(--muted-2);
    font-size:11px;
    line-height:1.5;
}
.modal-button{
    min-height:42px;
    padding:0 14px;
    border-radius:10px;
    background:rgba(148,163,184,.08);
    color:var(--text);
}
.modal-button.primary{
    background:
        linear-gradient(
            135deg,
            #8b5cf6,
            #4f46e5
        );
}
.modal-button:hover{
    filter:brightness(1.08);
}
.language-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
}
.language-option{
    min-height:45px;
    padding:0 12px;
    border:1px solid var(--border);
    border-radius:10px;
    background:rgba(148,163,184,.04);
    color:var(--muted);
    text-align:left;
}
.language-option:hover,
.language-option.active{
    border-color:rgba(139,92,246,.4);
    color:var(--text);
    background:rgba(139,92,246,.08);
}
.notion-info{
    padding:13px;
    border:1px solid var(--border);
    border-radius:12px;
    background:rgba(148,163,184,.035);
    color:var(--muted);
    font-size:12px;
    line-height:1.7;
    margin-bottom:15px;
}
.share-input{
    width:100%;
    min-height:80px;
    resize:none;
    padding:10px;
    outline:none;
    border:1px solid var(--border);
    border-radius:10px;
    background:#020617;
    color:var(--muted);
    font-size:11px;
}
/* =========================================================
   TOAST
   ========================================================= */
.toast-container{
    position:fixed;
    left:50%;
    bottom:28px;
    transform:translateX(-50%);
    z-index:500;
    display:flex;
    flex-direction:column;
    gap:7px;
    pointer-events:none;
}
.toast{
    padding:10px 14px;
    border:1px solid var(--border-strong);

/* =========================================================
   AUDIO
   ========================================================= */
let audioContext = null;
function getAudioContext(){
    if(!audioContext){
        const AudioCtx =
            window.AudioContext ||
            window.webkitAudioContext;
        if(!AudioCtx) return null;
        audioContext =
            new AudioCtx();
    }
    if(audioContext.state === "suspended"){
        audioContext.resume().catch(() => {});
    }
    return audioContext;
}
function bubbleSound(type = "output"){
    if(!state.soundEnabled) return;
    const ctx =
        getAudioContext();
    if(!ctx) return;
    const now =
        ctx.currentTime;
    const oscillator =
        ctx.createOscillator();
    const gain =
        ctx.createGain();
    let frequency = 580;
    if(type === "input") frequency = 420;
    if(type === "thinking") frequency = 330;
    oscillator.type = "sine";
    oscillator.frequency.setValueAtTime(
        frequency,
        now
    );
    oscillator.frequency.exponentialRampToValueAtTime(
        frequency * 1.32,
        now + .12
    );
    gain.gain.setValueAtTime(
        .0001,
        now
    );
    gain.gain.exponentialRampToValueAtTime(
        .055,
        now + .015
    );
    gain.gain.exponentialRampToValueAtTime(
        .0001,
        now + .16
    );
    oscillator.connect(gain);
    gain.connect(ctx.destination);
    oscillator.start(now);
    oscillator.stop(now + .18);
}
let lastSound = {
    input:0,
    output:0,
    thinking:0
};
function throttledSound(type){
    const now = Date.now();
    const limits = {
        input:650,
        output:700,
        thinking:1100
    };
    if(
        now -
        lastSound[type] <
        limits[type]
    ){
        return;
    }
    lastSound[type] = now;
    bubbleSound(type);
}

/* =========================================================
   MARKDOWN
   ========================================================= */
function escapeHTML(value){
    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}
function formatMarkdown(text){
    let html =
        escapeHTML(text || "");
    html =
        html.replace(
            /```([\s\S]*?)```/g,
            (_,code) =>
                "<pre><code>" +
                code.trim() +
                "</code></pre>"
        );
    html =
        html.replace(
            /`([^`]+)`/g,
            "<code>$1</code>"
        );
    html =
        html.replace(
            /\*\*(.*?)\*\*/g,
            "<strong>$1</strong>"
        );
    html =
        html.replace(
            /\*(.*?)\*/g,
            "<em>$1</em>"
        );
    html =
        html.replace(
            /^>\s?(.*)$/gm,
            '<div class="md-quote">$1</div>'
        );
    html =
        html.replace(
            /^[-*]\s+(.*)$/gm,
            "<div>• $1</div>"
        );
    html =
        html.replace(
            /\n\n/g,
            "</p><p>"
        );
    html =
        html.replace(
            /\n/g,
            "<br>"
        );
    return "<p>" + html + "</p>";
}

/* =========================================================
   STREAM CHAT
   ========================================================= */
async function streamChat(streamUI){
    const payload = {
        messages:state.messages,
        conversationId:
            state.currentConversationId,
        model:
            state.selectedModel,
        provider:
            getCurrentProvider().id,
        systemPrompt:
            buildSystemPrompt()
    };
    const response =
        await fetch(
            "/api/chat",
            {
                method:"POST",
                headers:{
                    "Content-Type":
                        "application/json",
                    "Accept":
                        "text/event-stream"
                },
                body:
                    JSON.stringify(payload),
                signal:
                    state.abortController.signal
            }
        );
    if(!response.ok){
        let message =
            `HTTP ${response.status}`;
        try{
            const data =
                await response.json();
            message =
                data?.error ||
                message;
        }catch{}
        throw new Error(message);
    }
    if(!response.body){
        throw new Error(
            "No streaming body"
        );
    }
    const reader =
        response.body.getReader();
    const decoder =
        new TextDecoder("utf-8");
    let buffer = "";
    while(true){
        const {
            value,
            done
        } =
            await reader.read();
        if(done) break;
        buffer +=
            decoder.decode(
                value,
                {stream:true}
            );
        const events =
            buffer.split(
                /\r?\n\r?\n/
            );
        buffer =
            events.pop() || "";
        for(const event of events){
            processSSEEvent(
                event,
                streamUI
            );
        }
    }
    buffer += decoder.decode();
    if(buffer.trim()){
        processSSEEvent(
            buffer,
            streamUI
        );
    }
    if(!state.streamAnswer){
        state.streamAnswer =
            "...";
    }
    state.messages.push({
        role:"assistant",
        content:state.streamAnswer
    });
    saveCurrentConversation();
}
/* =========================================================
   SSE
   ========================================================= */
function processSSEEvent(
    event,
    streamUI
){
    const dataLines =
        event
            .split(/\r?\n/)
            .filter(
                line =>
                    line.startsWith("data:")
            )
            .map(
                line =>
                    line.slice(5).trim()
            );
    if(!dataLines.length) return;
    const data =
        dataLines.join("\n");
    if(!data || data === "[DONE]"){
        return;
    }
    let packet;
    try{
        packet =
            JSON.parse(data);
    }catch{
        return;
    }
    if(packet.type === "reasoning"){
        state.streamReasoning +=
            packet.content || "";
        streamUI.thinkingContent.textContent =
            state.streamReasoning;
        streamUI.thinking.classList.add(
            "open"
        );
        throttledSound("thinking");
        scrollToBottom();
        return;
    }
    if(packet.type === "delta"){
        if(!state.streamAnswer){
            throttledSound("output");
        }
        state.streamAnswer +=
            packet.content || "";
        streamUI.content.innerHTML =
            formatMarkdown(
                state.streamAnswer
            );
        scrollToBottom();
        return;
    }
    if(packet.type === "error"){
        throw new Error(
            packet.error ||
            "AI request failed"
        );
    }
    if(packet.type === "done"){
        streamUI.thinking
            .querySelector(
                ".thinking-dots"
            )
            ?.remove();
        setStatus(
            "Online",
            false
        );
    }
}

function startVoice(){
    const Recognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;
    if(!Recognition){
        toast(
            state.language === "zh"
            ? "当前浏览器不支持语音识别"
            : "Speech recognition is not supported"
        );
        return;
    }
    getAudioContext();
    const recognition =
        new Recognition();
    recognition.lang =
        {
            zh:"zh-CN",
            en:"en-US",
            ja:"ja-JP",
            ko:"ko-KR",
            fr:"fr-FR",
            de:"de-DE",
            es:"es-ES",
            ru:"ru-RU",
            ar:"ar-SA"
        }[state.language] ||
        "zh-CN";
    recognition.continuous = true;
    recognition.interimResults = true;
    state.recognition = recognition;
    state.isRecording = true;
    $("voiceBtn").classList.add(
        "recording"
    );
    $("voiceBtn").innerHTML =
        '<span style="width:8px;height:8px;border-radius:50%;background:#ef4444;display:block"></span>';
    let finalText = "";
    recognition.onresult = event => {
        let interim = "";
        for(
            let i = event.resultIndex;
            i < event.results.length;
            i++
        ){
            const result =
                event.results[i];
            const transcript =
                result[0].transcript;
            if(result.isFinal){
                finalText += transcript;
            }else{
                interim += transcript;
            }
        }
        input.value =
            finalText +
            interim;
        autoResize();
    };
    recognition.onerror = error => {
        console.warn(
            "Speech recognition",
            error
        );
        stopVoice();
    };
    recognition.onend = () => {
        if(state.isRecording){
            try{
                recognition.start();
            }catch{}
        }
    };
    try{
        recognition.start();
    }catch{
        stopVoice();
    }
}
function stopVoice(){
    state.isRecording = false;

async function saveToNotion(){
    if(!state.messages.length){
        toast(
            state.language === "zh"
            ? "当前没有可保存的对话"
            : "No conversation to save"
        );
        return;
    }
    const button =
        $("saveNotionBtn");
    const original =
        button.textContent;
    button.disabled = true;
    button.textContent = "Saving...";
    try{
        const conversation =
            state.conversations.find(
                item =>
                    item.id ===
                    state.currentConversationId
            );
        const title =
            conversation?.title ||
            "CQS AI Conversation";
        const response =
            await fetch(
                "/api/notion",
                {
                    method:"POST",
                    headers:{
                        "Content-Type":
                            "application/json"
                    },
                    body:
                        JSON.stringify({
                            conversationId:
                                state.currentConversationId,
                            title,
                            messages:
                                state.messages
                        })
                }
            );
        let data = {};
        try{
            data =
                await response.json();
        }catch{
            throw new Error(
                `HTTP ${response.status}`
            );
        }
        if(
            !response.ok ||
            !data.success
        ){
            throw new Error(
                data?.error ||
                "Notion save failed"
            );
        }
        toast(
            state.language === "zh"
            ? "对话已保存到 Notion"
            : "Saved to Notion"
        );
        console.log(
            "[CQS Notion Saved]",
            {
                pageId:data.pageId,
                url:data.url,
                conversationId:data.conversationId
            }
        );
    }catch(error){
        console.error(
            "[CQS Notion Error]",
            error
        );
        toast(
            state.language === "zh"
            ? `Notion 保存失败：${error.message || "未知错误"}`
            : `Notion save failed: ${error.message || "Unknown error"}`
        );
    }finally{
        button.disabled = false;
        button.textContent = original;
    }
}

function downloadFile(
    content,
    filename,
    type
){
    const blob =
        new Blob(
            [content],
            {type}
        );
    const url =
        URL.createObjectURL(blob);
    const link =
        document.createElement("a");
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(
        () =>
            URL.revokeObjectURL(url),
        1000
    );
}
function exportTXT(){
    const conversation =
        state.conversations.find(
            item =>
                item.id ===
                state.currentConversationId
        );
    const title =
        conversation?.title ||
        "CQS AI Conversation";
    const lines = [
        "CQS AI",
        title,
        ""
    ];
    state.messages.forEach(message => {
        lines.push(
            message.role === "user"
            ? "USER"
            : "CQS AI"
        );
        lines.push(
            message.content || ""
        );
        lines.push("");
    });
    downloadFile(
        lines.join("\n"),
        "cqs-ai-conversation.txt",
        "text/plain;charset=utf-8"
    );
    toast("TXT exported");
}
function exportJSON(){
    downloadFile(
        JSON.stringify(
            {
                conversationId:
                    state.currentConversationId,
                model:
                    state.selectedModel,
                provider:
                    getCurrentProvider().id,
                messages:
                    state.messages,
                exportedAt:
                    new Date().toISOString()

            null,
            2
        ),
        "cqs-ai-conversation.json",
        "application/json;charset=utf-8"
    );
    toast("JSON exported");
}

function encodeBase64Unicode(value){
    const bytes =
        new TextEncoder()
            .encode(value);
    let binary = "";
    bytes.forEach(
        byte =>
            binary +=
                String.fromCharCode(byte)
    );
    return btoa(binary);
}
function decodeBase64Unicode(value){
    const binary =
        atob(value);
    const bytes =
        Uint8Array.from(
            binary,
            char =>
                char.charCodeAt(0)
        );
    return new TextDecoder()
        .decode(bytes);
}

async function copyText(text){
    try{
        if(navigator.clipboard){
            await navigator.clipboard.writeText(
                text
            );
        }else{
            const area =
                document.createElement("textarea");
            area.value = text;
            document.body.appendChild(area);
            area.select();
            document.execCommand("copy");
            area.remove();
        }
        toast(
            state.language === "zh"
            ? "已复制"
            : "Copied"
        );
    }catch{
        toast("Copy failed");
    }
}

/* =========================================================
   WELCOME ANIMATION
   ========================================================= */
function initWelcomeAnimation(){
    const title =
        $("welcomeTitle");
    if(!title) return;
    const text =
        title.textContent;
    title.innerHTML = "";
    [...text].forEach(
        (char,index) => {
            const span =
                document.createElement("span");
            span.className = "letter";
            span.textContent =
                char === " "
                ? "\u00a0"
                : char;
            span.style.animationDelay =
                `${index * 90}ms`;
            title.appendChild(span);
        }
    );
}
/* =========================================================
   SHARED CONVERSATION
   ========================================================= */
function loadSharedConversation(){
    if(
        !window.location.hash.startsWith(
            "#share="
        )
    ){
        return false;
    }
    try{
        const encoded =
            decodeURIComponent(
                window.location.hash.substring(7)
            );
        const json =
            decodeBase64Unicode(encoded);
        const data =
            JSON.parse(json);
        if(
            !Array.isArray(data.messages)
        ){
            return false;
        }
        state.messages =
            data.messages;
        state.currentConversationId =
            createId();
        state.conversations.push({
            id:
                state.currentConversationId,
            title:
                "Shared CQS AI Conversation",
            messages:
                state.messages,
            createdAt:
                Date.now(),
            updatedAt:
                Date.now()
        });
        saveConversations();
        renderHistory();
        renderMessages();
        return true;
    }catch(error){
        console.warn(
            "Invalid share data",
            error
        );
        return false;
    }
}
/* =========================================================
   INIT
   ========================================================= */
function init(){
    updateViewportHeight();
    loadConversations();
    initModel();
    applyLanguage();
    updateSoundButtons();
    initWelcomeAnimation();
    renderHistory();
    const shared =
        loadSharedConversation();
    if(
        !shared &&
        state.conversations.length
    ){
        const latest =
            [...state.conversations]
                .sort(
                    (a,b) =>
                        b.updatedAt -
                        a.updatedAt
                )[0];
        if(
            latest &&
            Array.isArray(latest.messages) &&
            latest.messages.length
        ){
            state.currentConversationId =
                latest.id;
            state.messages =
                latest.messages;
            renderHistory();
            renderMessages();
        }
    }
    setStatus(
        "Online",
        false
    );
}
